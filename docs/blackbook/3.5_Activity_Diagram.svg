<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1140" width="100%" height="100%" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- PURE WHITE BACKGROUND -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Diagram Title -->
  <text x="590" y="32" text-anchor="middle" fill="#0f172a" font-size="21" font-weight="800" letter-spacing="0.5">
    3.5 Activity Diagram - Petaverse Workflows
  </text>

  <!-- ==================== FLOW 1: INITIAL ENTRY & AUTHENTICATION ==================== -->

  <!-- Start Node -->
  <circle cx="590" cy="62" r="14" fill="#0f172a" />
  <text x="616" y="67" fill="#0f172a" font-size="12.5" font-weight="700">Start</text>

  <!-- Arrow Start -> Access Portal -->
  <line x1="590" y1="76" x2="590" y2="100" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- Action: Access Portal -->
  <g transform="translate(450, 100)" filter="url(#shadow)">
    <rect width="280" height="42" rx="8" fill="#1e3a8a" />
    <text x="140" y="26" text-anchor="middle" fill="#ffffff" font-size="13.5" font-weight="600">Access Petaverse Portal</text>
  </g>

  <!-- Arrow Access Portal -> Decision Registered -->
  <line x1="590" y1="142" x2="590" y2="170" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- Decision: Is User Registered? -->
  <g transform="translate(505, 170)">
    <polygon points="85,0 170,30 85,60 0,30" fill="#f8fafc" stroke="#1e3a8a" stroke-width="2" />
    <text x="85" y="27" text-anchor="middle" fill="#0f172a" font-size="11.5" font-weight="700">Is User</text>
    <text x="85" y="42" text-anchor="middle" fill="#0f172a" font-size="11.5" font-weight="700">Registered?</text>
  </g>

  <!-- Branch No -> Register -->
  <path d="M 505 200 L 310 200 L 310 240" fill="none" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="400" y="193" text-anchor="middle" fill="#ef4444" font-size="12" font-weight="700">No</text>

  <!-- Action: Register -->
  <g transform="translate(190, 240)" filter="url(#shadow)">
    <rect width="240" height="46" rx="8" fill="#1e3a8a" />
    <text x="120" y="20" text-anchor="middle" fill="#ffffff" font-size="12.5" font-weight="600">Sign Up / Register</text>
    <text x="120" y="36" text-anchor="middle" fill="#bfdbfe" font-size="11">(Name, Email, Password)</text>
  </g>

  <!-- Branch Yes -> Login -->
  <line x1="590" y1="230" x2="590" y2="260" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="604" y="248" fill="#16a34a" font-size="12" font-weight="700">Yes</text>

  <!-- Action: Login -->
  <g transform="translate(470, 260)" filter="url(#shadow)">
    <rect width="240" height="46" rx="8" fill="#1e3a8a" />
    <text x="120" y="20" text-anchor="middle" fill="#ffffff" font-size="12.5" font-weight="600">Login to Account</text>
    <text x="120" y="36" text-anchor="middle" fill="#bfdbfe" font-size="11">(Email, Password / Google)</text>
  </g>

  <!-- Join from Register to Authenticate -->
  <path d="M 310 286 L 310 348 L 450 348" fill="none" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- Arrow Login -> Authenticate -->
  <line x1="590" y1="306" x2="590" y2="345" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- Action: Authenticate Credentials -->
  <g transform="translate(450, 345)" filter="url(#shadow)">
    <rect width="280" height="42" rx="8" fill="#1e3a8a" />
    <text x="140" y="26" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">Authenticate Credentials (JWT)</text>
  </g>

  <!-- Arrow Authenticate -> Decision Successful -->
  <line x1="590" y1="387" x2="590" y2="415" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- Decision: Auth Successful? -->
  <g transform="translate(500, 415)">
    <polygon points="90,0 180,30 90,60 0,30" fill="#f8fafc" stroke="#1e3a8a" stroke-width="2" />
    <text x="90" y="27" text-anchor="middle" fill="#0f172a" font-size="11.5" font-weight="700">Authentication</text>
    <text x="90" y="42" text-anchor="middle" fill="#0f172a" font-size="11.5" font-weight="700">Successful?</text>
  </g>

  <!-- Branch No -> Error & Retry -->
  <path d="M 680 445 L 780 445" fill="none" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="720" y="437" fill="#ef4444" font-size="12" font-weight="700">No</text>

  <g transform="translate(780, 423)" filter="url(#shadow)">
    <rect width="180" height="44" rx="8" fill="#b91c1c" />
    <text x="90" y="20" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="600">Show Error Message</text>
    <text x="90" y="35" text-anchor="middle" fill="#fecaca" font-size="11">&amp; Prompt Retry</text>
  </g>
  <!-- Retry Loop back -->
  <path d="M 870 423 L 870 283 L 710 283" fill="none" stroke="#1e293b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)" />

  <!-- Branch Yes -> Dashboard -->
  <line x1="590" y1="475" x2="590" y2="505" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="604" y="492" fill="#16a34a" font-size="12" font-weight="700">Yes</text>

  <!-- Action: View Dashboard -->
  <g transform="translate(370, 505)" filter="url(#shadow)">
    <rect width="440" height="48" rx="8" fill="#0f766e" />
    <text x="220" y="22" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">View Petaverse Main Dashboard</text>
    <text x="220" y="39" text-anchor="middle" fill="#ccfbf1" font-size="11.5">(Pet Catalog, QR Tag Status, Lost SOS Beacon)</text>
  </g>

  <!-- Arrow Dashboard -> Fork Bar -->
  <line x1="590" y1="553" x2="590" y2="585" stroke="#1e293b" stroke-width="2.2" marker-end="url(#arrow)" />

  <!-- ==================== FORK BAR (Thick Synchronization Line) ==================== -->
  <rect x="50" y="585" width="1080" height="8" rx="4" fill="#0f172a" />

  <!-- 5 Branch Lines from Fork Bar -->
  <line x1="150" y1="593" x2="150" y2="625" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)" />
  <line x1="370" y1="593" x2="370" y2="625" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)" />
  <line x1="590" y1="593" x2="590" y2="625" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)" />
  <line x1="810" y1="593" x2="810" y2="625" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)" />
  <line x1="1030" y1="593" x2="1030" y2="625" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- ==================== COLUMN 1: PET SAFETY & QR (Center x: 150) ==================== -->
  <g transform="translate(60, 625)" filter="url(#shadow)">
    <rect width="180" height="40" rx="6" fill="#1e3a8a" />
    <text x="90" y="25" text-anchor="middle" fill="#ffffff" font-size="12.5" font-weight="600">Pet Safety &amp; QR Tag</text>
  </g>
  <line x1="150" y1="665" x2="150" y2="695" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- Decision: Generate or Scan? -->
  <g transform="translate(80, 695)">
    <polygon points="70,0 140,26 70,52 0,26" fill="#f8fafc" stroke="#1e3a8a" stroke-width="1.8" />
    <text x="70" y="23" text-anchor="middle" fill="#0f172a" font-size="11" font-weight="700">Generate or</text>
    <text x="70" y="37" text-anchor="middle" fill="#0f172a" font-size="11" font-weight="700">Scan QR?</text>
  </g>

  <!-- Left: Generate QR -->
  <path d="M 80 721 L 45 721 L 45 765" fill="none" stroke="#1e293b" stroke-width="1.6" marker-end="url(#arrow)" />
  <text x="58" y="714" fill="#1e293b" font-size="10" font-weight="700">Generate</text>
  <g transform="translate(5, 765)" filter="url(#shadow)">
    <rect width="95" height="52" rx="6" fill="#1e40af" />
    <text x="47" y="19" text-anchor="middle" fill="#ffffff" font-size="10.5" font-weight="600">Download</text>
    <text x="47" y="34" text-anchor="middle" fill="#ffffff" font-size="10.5" font-weight="600">QR Tag Card</text>
    <text x="47" y="46" text-anchor="middle" fill="#bfdbfe" font-size="9">(Collar Tag)</text>
  </g>

  <!-- Right: Scan QR -->
  <path d="M 220 721 L 245 721 L 245 765" fill="none" stroke="#1e293b" stroke-width="1.6" marker-end="url(#arrow)" />
  <text x="230" y="714" fill="#1e293b" font-size="10" font-weight="700">Scan</text>
  <g transform="translate(195, 765)" filter="url(#shadow)">
    <rect width="100" height="52" rx="6" fill="#1e40af" />
    <text x="50" y="19" text-anchor="middle" fill="#ffffff" font-size="10.5" font-weight="600">Scan Collar QR</text>
    <text x="50" y="34" text-anchor="middle" fill="#ffffff" font-size="10.5" font-weight="600">&amp; Contact</text>
    <text x="50" y="46" text-anchor="middle" fill="#bfdbfe" font-size="9">(Pet Owner)</text>
  </g>

  <!-- Rejoin col 1 -->
  <path d="M 52 817 L 52 855 L 150 855" fill="none" stroke="#1e293b" stroke-width="1.6" />
  <path d="M 245 817 L 245 855 L 150 855" fill="none" stroke="#1e293b" stroke-width="1.6" />
  <line x1="150" y1="855" x2="150" y2="930" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- ==================== COLUMN 2: LOST PET SOS (Center x: 370) ==================== -->
  <g transform="translate(280, 625)" filter="url(#shadow)">
    <rect width="180" height="40" rx="6" fill="#1e3a8a" />
    <text x="90" y="25" text-anchor="middle" fill="#ffffff" font-size="12.5" font-weight="600">Lost Pet SOS Beacon</text>
  </g>
  <line x1="370" y1="665" x2="370" y2="695" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- Decision: SOS Trigger or View? -->
  <g transform="translate(300, 695)">
    <polygon points="70,0 140,26 70,52 0,26" fill="#f8fafc" stroke="#1e3a8a" stroke-width="1.8" />
    <text x="70" y="23" text-anchor="middle" fill="#0f172a" font-size="11" font-weight="700">Trigger Alert</text>
    <text x="70" y="37" text-anchor="middle" fill="#0f172a" font-size="11" font-weight="700">or View Map?</text>
  </g>

  <!-- Left: Activate SOS Beacon -->
  <path d="M 300 721 L 270 721 L 270 765" fill="none" stroke="#1e293b" stroke-width="1.6" marker-end="url(#arrow)" />
  <text x="260" y="714" fill="#1e293b" font-size="10" font-weight="700">Trigger</text>
  <g transform="translate(225, 765)" filter="url(#shadow)">
    <rect width="95" height="52" rx="6" fill="#dc2626" />
    <text x="47" y="19" text-anchor="middle" fill="#ffffff" font-size="10.5" font-weight="700">Activate SOS</text>
    <text x="47" y="34" text-anchor="middle" fill="#ffffff" font-size="10.5" font-weight="600">Beacon Alert</text>
    <text x="47" y="46" text-anchor="middle" fill="#fee2e2" font-size="9">(Broadcast)</text>
  </g>

  <!-- Right: View Community Map -->
  <path d="M 440 721 L 465 721 L 465 765" fill="none" stroke="#1e293b" stroke-width="1.6" marker-end="url(#arrow)" />
  <text x="450" y="714" fill="#1e293b" font-size="10" font-weight="700">View</text>
  <g transform="translate(415, 765)" filter="url(#shadow)">
    <rect width="95" height="52" rx="6" fill="#1e40af" />
    <text x="47" y="19" text-anchor="middle" fill="#ffffff" font-size="10.5" font-weight="600">View Live</text>
    <text x="47" y="34" text-anchor="middle" fill="#ffffff" font-size="10.5" font-weight="600">Lost/Found</text>
    <text x="47" y="46" text-anchor="middle" fill="#bfdbfe" font-size="9">(Listing Map)</text>
  </g>

  <!-- Rejoin col 2 -->
  <path d="M 270 817 L 270 855 L 370 855" fill="none" stroke="#1e293b" stroke-width="1.6" />
  <path d="M 465 817 L 465 855 L 370 855" fill="none" stroke="#1e293b" stroke-width="1.6" />
  <line x1="370" y1="855" x2="370" y2="930" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- ==================== COLUMN 3: PROFILE & PETS (Center x: 590) ==================== -->
  <g transform="translate(500, 625)" filter="url(#shadow)">
    <rect width="180" height="40" rx="6" fill="#1e3a8a" />
    <text x="90" y="25" text-anchor="middle" fill="#ffffff" font-size="12.5" font-weight="600">Profile &amp; Pet Records</text>
  </g>
  <line x1="590" y1="665" x2="590" y2="695" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)" />

  <g transform="translate(520, 695)">
    <polygon points="70,0 140,26 70,52 0,26" fill="#f8fafc" stroke="#1e3a8a" stroke-width="1.8" />
    <text x="70" y="23" text-anchor="middle" fill="#0f172a" font-size="11" font-weight="700">Edit Details</text>
    <text x="70" y="37" text-anchor="middle" fill="#0f172a" font-size="11" font-weight="700">or Return?</text>
  </g>

  <!-- Left: Update Info -->
  <path d="M 520 721 L 490 721 L 490 765" fill="none" stroke="#1e293b" stroke-width="1.6" marker-end="url(#arrow)" />
  <text x="480" y="714" fill="#1e293b" font-size="10" font-weight="700">Edit</text>
  <g transform="translate(440, 765)" filter="url(#shadow)">
    <rect width="100" height="52" rx="6" fill="#1e40af" />
    <text x="50" y="19" text-anchor="middle" fill="#ffffff" font-size="10.5" font-weight="600">Update Pet /</text>
    <text x="50" y="34" text-anchor="middle" fill="#ffffff" font-size="10.5" font-weight="600">User Profile</text>
    <text x="50" y="46" text-anchor="middle" fill="#bfdbfe" font-size="9">(Saved to DB)</text>
  </g>

  <!-- Right: Return to Dashboard -->
  <path d="M 660 721 L 685 721 L 685 765" fill="none" stroke="#1e293b" stroke-width="1.6" marker-end="url(#arrow)" />
  <text x="670" y="714" fill="#1e293b" font-size="10" font-weight="700">Keep</text>
  <g transform="translate(635, 765)" filter="url(#shadow)">
    <rect width="100" height="52" rx="6" fill="#1e40af" />
    <text x="50" y="24" text-anchor="middle" fill="#ffffff" font-size="10.5" font-weight="600">Keep Current</text>
    <text x="50" y="39" text-anchor="middle" fill="#ffffff" font-size="10.5" font-weight="600">Information</text>
  </g>

  <!-- Rejoin col 3 -->
  <path d="M 490 817 L 490 855 L 590 855" fill="none" stroke="#1e293b" stroke-width="1.6" />
  <path d="M 685 817 L 685 855 L 590 855" fill="none" stroke="#1e293b" stroke-width="1.6" />
  <line x1="590" y1="855" x2="590" y2="930" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- ==================== COLUMN 4: ADOPTIONS (Center x: 810) ==================== -->
  <g transform="translate(720, 625)" filter="url(#shadow)">
    <rect width="180" height="40" rx="6" fill="#1e3a8a" />
    <text x="90" y="25" text-anchor="middle" fill="#ffffff" font-size="12.5" font-weight="600">Browse Adoptions</text>
  </g>
  <line x1="810" y1="665" x2="810" y2="700" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)" />

  <g transform="translate(725, 700)" filter="url(#shadow)">
    <rect width="170" height="46" rx="6" fill="#1e40af" />
    <text x="85" y="19" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="600">Filter by Breed,</text>
    <text x="85" y="34" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="600">Species &amp; Location</text>
  </g>
  <line x1="810" y1="746" x2="810" y2="775" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)" />

  <g transform="translate(725, 775)" filter="url(#shadow)">
    <rect width="170" height="46" rx="6" fill="#1e40af" />
    <text x="85" y="19" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="600">Submit Adoption</text>
    <text x="85" y="34" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="600">Inquiry Application</text>
  </g>
  <line x1="810" y1="821" x2="810" y2="930" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- ==================== COLUMN 5: COMMUNITY HELP & REPORTS (Center x: 1030) ==================== -->
  <g transform="translate(940, 625)" filter="url(#shadow)">
    <rect width="180" height="40" rx="6" fill="#1e3a8a" />
    <text x="90" y="25" text-anchor="middle" fill="#ffffff" font-size="12.5" font-weight="600">Community Help &amp; Reports</text>
  </g>
  <line x1="1030" y1="665" x2="1030" y2="700" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)" />

  <g transform="translate(945, 700)" filter="url(#shadow)">
    <rect width="170" height="46" rx="6" fill="#1e40af" />
    <text x="85" y="19" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="600">Report Inappropriate</text>
    <text x="85" y="34" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="600">Listing / User</text>
  </g>
  <line x1="1030" y1="746" x2="1030" y2="775" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)" />

  <g transform="translate(945, 775)" filter="url(#shadow)">
    <rect width="170" height="46" rx="6" fill="#1e40af" />
    <text x="85" y="19" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="600">Track Resolution</text>
    <text x="85" y="34" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="600">&amp; Ticket Status</text>
  </g>
  <line x1="1030" y1="821" x2="1030" y2="930" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- ==================== JOIN BAR (Synchronization Line) ==================== -->
  <rect x="50" y="930" width="1080" height="8" rx="4" fill="#0f172a" />

  <!-- Arrow Join Bar -> Logout -->
  <line x1="590" y1="938" x2="590" y2="975" stroke="#1e293b" stroke-width="2.2" marker-end="url(#arrow)" />

  <!-- Action: Logout -->
  <g transform="translate(485, 975)" filter="url(#shadow)">
    <rect width="210" height="42" rx="8" fill="#1e3a8a" />
    <text x="105" y="26" text-anchor="middle" fill="#ffffff" font-size="13.5" font-weight="600">Logout / End Session</text>
  </g>

  <!-- Arrow Logout -> End -->
  <line x1="590" y1="1017" x2="590" y2="1050" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- End Node (Bullseye) -->
  <circle cx="590" cy="1068" r="15" fill="#ffffff" stroke="#0f172a" stroke-width="2.5" />
  <circle cx="590" cy="1068" r="9" fill="#0f172a" />
  <text x="618" y="1073" fill="#0f172a" font-size="12.5" font-weight="700">End</text>

</svg>
