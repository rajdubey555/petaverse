<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780" width="100%" height="100%" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Arrow marker -->
    <marker id="arrow-solid" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#334155" />
    </marker>
    <!-- Subtle drop shadow -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- PURE WHITE BACKGROUND -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Title -->
  <text x="500" y="42" text-anchor="middle" fill="#0f172a" font-size="18" font-weight="800" letter-spacing="0.5">
    OBJECT DIAGRAM – PETAVERSE (PET RESCUE &amp; ADOPTION PLATFORM)
  </text>

  <!-- ==================== CONNECTING ARROWS ==================== -->

  <!-- admin1 -> user1: monitors -->
  <line x1="320" y1="130" x2="550" y2="130" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow-solid)" />
  <text x="435" y="118" text-anchor="middle" fill="#334155" font-size="11.5" font-weight="600">monitors</text>
  <text x="435" y="145" text-anchor="middle" fill="#64748b" font-size="11" font-weight="600">(1 : Many)</text>

  <!-- admin1 -> report1: reviews (left angle) -->
  <line x1="165" y1="210" x2="115" y2="350" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow-solid)" />
  <text x="95" y="275" text-anchor="middle" fill="#334155" font-size="11.5" font-weight="600">reviews</text>
  <text x="95" y="292" text-anchor="middle" fill="#64748b" font-size="11" font-weight="600">(1 : Many)</text>

  <!-- admin1 -> perm1: defines (straight down) -->
  <line x1="265" y1="210" x2="265" y2="520" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow-solid)" />
  <text x="290" y="325" text-anchor="middle" fill="#334155" font-size="11.5" font-weight="600">defines</text>
  <text x="290" y="342" text-anchor="middle" fill="#64748b" font-size="11" font-weight="600">(1 : Many)</text>

  <!-- user1 -> pet1: registers -->
  <line x1="590" y1="210" x2="410" y2="350" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow-solid)" />
  <text x="465" y="275" text-anchor="middle" fill="#334155" font-size="11.5" font-weight="600">registers</text>
  <text x="465" y="292" text-anchor="middle" fill="#64748b" font-size="11" font-weight="600">(1 : Many)</text>

  <!-- user1 -> tag1: generates -->
  <line x1="660" y1="210" x2="595" y2="350" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow-solid)" />
  <text x="615" y="275" text-anchor="middle" fill="#334155" font-size="11.5" font-weight="600">generates</text>
  <text x="615" y="292" text-anchor="middle" fill="#64748b" font-size="11" font-weight="600">(1 : Many)</text>

  <!-- user1 -> sos1: triggers -->
  <line x1="730" y1="210" x2="790" y2="350" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow-solid)" />
  <text x="785" y="275" text-anchor="middle" fill="#334155" font-size="11.5" font-weight="600">triggers</text>
  <text x="785" y="292" text-anchor="middle" fill="#64748b" font-size="11" font-weight="600">(1 : Many)</text>

  <!-- ==================== TOP ROW OBJECTS ==================== -->

  <!-- Object 1: admin1 : Admin (Blue) -->
  <g transform="translate(115, 70)" filter="url(#shadow)">
    <rect width="205" height="140" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" />
    <rect width="205" height="30" rx="6" fill="#bfdbfe" />
    <text x="102" y="20" text-anchor="middle" fill="#1e3a8a" font-size="13" font-weight="700">admin1 : Admin</text>
    <line x1="0" y1="30" x2="205" y2="30" stroke="#2563eb" stroke-width="1" />

    <text x="12" y="48" fill="#1e293b" font-size="11" font-weight="600">admin_id</text>
    <text x="75" y="48" fill="#334155" font-size="11">= A101</text>

    <text x="12" y="66" fill="#1e293b" font-size="11" font-weight="600">name</text>
    <text x="75" y="66" fill="#334155" font-size="11">= Raj Admin</text>

    <text x="12" y="84" fill="#1e293b" font-size="11" font-weight="600">email</text>
    <text x="75" y="84" fill="#334155" font-size="11">= admin@petaverse.com</text>

    <text x="12" y="102" fill="#1e293b" font-size="11" font-weight="600">role</text>
    <text x="75" y="102" fill="#334155" font-size="11">= Super Admin</text>

    <text x="12" y="120" fill="#1e293b" font-size="11" font-weight="600">mobile</text>
    <text x="75" y="120" fill="#334155" font-size="11">= 9876543210</text>
  </g>

  <!-- Object 2: user1 : PetOwner (Green) -->
  <g transform="translate(550, 70)" filter="url(#shadow)">
    <rect width="220" height="140" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" />
    <rect width="220" height="30" rx="6" fill="#bbf7d0" />
    <text x="110" y="20" text-anchor="middle" fill="#14532d" font-size="13" font-weight="700">user1 : PetOwner</text>
    <line x1="0" y1="30" x2="220" y2="30" stroke="#16a34a" stroke-width="1" />

    <text x="12" y="48" fill="#1e293b" font-size="11" font-weight="600">user_id</text>
    <text x="95" y="48" fill="#334155" font-size="11">= U201</text>

    <text x="12" y="66" fill="#1e293b" font-size="11" font-weight="600">name</text>
    <text x="95" y="66" fill="#334155" font-size="11">= Amit Sharma</text>

    <text x="12" y="84" fill="#1e293b" font-size="11" font-weight="600">email</text>
    <text x="95" y="84" fill="#334155" font-size="11">= amit@gmail.com</text>

    <text x="12" y="102" fill="#1e293b" font-size="11" font-weight="600">city</text>
    <text x="95" y="102" fill="#334155" font-size="11">= Mumbai</text>

    <text x="12" y="120" fill="#1e293b" font-size="11" font-weight="600">registered_on</text>
    <text x="95" y="120" fill="#334155" font-size="11">= 01-04-2026</text>
  </g>

  <!-- ==================== BOTTOM ROW OBJECTS ==================== -->

  <!-- Object 3: report1 : ModerationReport (Yellow) -->
  <g transform="translate(18, 350)" filter="url(#shadow)">
    <rect width="190" height="145" rx="6" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5" />
    <rect width="190" height="28" rx="6" fill="#fef08a" />
    <text x="95" y="19" text-anchor="middle" fill="#713f12" font-size="12" font-weight="700">report1 : ModerationReport</text>
    <line x1="0" y1="28" x2="190" y2="28" stroke="#ca8a04" stroke-width="1" />

    <text x="10" y="46" fill="#1e293b" font-size="10.5" font-weight="600">report_id</text>
    <text x="80" y="46" fill="#334155" font-size="10.5">= R301</text>

    <text x="10" y="64" fill="#1e293b" font-size="10.5" font-weight="600">target_pet</text>
    <text x="80" y="64" fill="#334155" font-size="10.5">= PT401</text>

    <text x="10" y="82" fill="#1e293b" font-size="10.5" font-weight="600">reason</text>
    <text x="80" y="82" fill="#334155" font-size="10.5">= Duplicate Post</text>

    <text x="10" y="100" fill="#1e293b" font-size="10.5" font-weight="600">assigned_by</text>
    <text x="80" y="100" fill="#334155" font-size="10.5">= admin1</text>

    <text x="10" y="118" fill="#1e293b" font-size="10.5" font-weight="600">assigned_to</text>
    <text x="80" y="118" fill="#334155" font-size="10.5">= mod_team</text>

    <text x="10" y="136" fill="#1e293b" font-size="10.5" font-weight="600">status</text>
    <text x="80" y="136" fill="#334155" font-size="10.5">= In Progress</text>
  </g>

  <!-- Object 4: perm1 : Permission (Orange) -->
  <g transform="translate(165, 520)" filter="url(#shadow)">
    <rect width="205" height="110" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5" />
    <rect width="205" height="28" rx="6" fill="#ffedd5" />
    <text x="102" y="19" text-anchor="middle" fill="#7c2d12" font-size="12" font-weight="700">perm1 : Permission</text>
    <line x1="0" y1="28" x2="205" y2="28" stroke="#ea580c" stroke-width="1" />

    <text x="10" y="46" fill="#1e293b" font-size="10.5" font-weight="600">permission_id</text>
    <text x="90" y="46" fill="#334155" font-size="10.5">= P701</text>

    <text x="10" y="66" fill="#1e293b" font-size="10.5" font-weight="600">admin_id</text>
    <text x="90" y="66" fill="#334155" font-size="10.5">= A101</text>

    <text x="10" y="86" fill="#1e293b" font-size="10.5" font-weight="600">module_name</text>
    <text x="90" y="86" fill="#334155" font-size="10.5">= Pet SOS / Tags</text>

    <text x="10" y="104" fill="#1e293b" font-size="10.5" font-weight="600">access</text>
    <text x="90" y="104" fill="#334155" font-size="10.5">= Full Access</text>
  </g>

  <!-- Object 5: pet1 : Pet (Purple) -->
  <g transform="translate(315, 350)" filter="url(#shadow)">
    <rect width="170" height="145" rx="6" fill="#faf5ff" stroke="#9333ea" stroke-width="1.5" />
    <rect width="170" height="28" rx="6" fill="#f3e8ff" />
    <text x="85" y="19" text-anchor="middle" fill="#581c87" font-size="12" font-weight="700">pet1 : Pet</text>
    <line x1="0" y1="28" x2="170" y2="28" stroke="#9333ea" stroke-width="1" />

    <text x="10" y="46" fill="#1e293b" font-size="10.5" font-weight="600">pet_id</text>
    <text x="65" y="46" fill="#334155" font-size="10.5">= PT401</text>

    <text x="10" y="64" fill="#1e293b" font-size="10.5" font-weight="600">owner_id</text>
    <text x="65" y="64" fill="#334155" font-size="10.5">= U201</text>

    <text x="10" y="82" fill="#1e293b" font-size="10.5" font-weight="600">name</text>
    <text x="65" y="82" fill="#334155" font-size="10.5">= Bruno</text>

    <text x="10" y="100" fill="#1e293b" font-size="10.5" font-weight="600">species</text>
    <text x="65" y="100" fill="#334155" font-size="10.5">= Dog (Golden)</text>

    <text x="10" y="118" fill="#1e293b" font-size="10.5" font-weight="600">age</text>
    <text x="65" y="118" fill="#334155" font-size="10.5">= 2 Years</text>

    <text x="10" y="136" fill="#1e293b" font-size="10.5" font-weight="600">status</text>
    <text x="65" y="136" fill="#334155" font-size="10.5">= Safe / Registered</text>
  </g>

  <!-- Object 6: tag1 : CollarQRCode (Pink) -->
  <g transform="translate(505, 350)" filter="url(#shadow)">
    <rect width="175" height="145" rx="6" fill="#fdf2f8" stroke="#db2777" stroke-width="1.5" />
    <rect width="175" height="28" rx="6" fill="#fce7f3" />
    <text x="87" y="19" text-anchor="middle" fill="#831843" font-size="12" font-weight="700">tag1 : CollarQRCode</text>
    <line x1="0" y1="28" x2="175" y2="28" stroke="#db2777" stroke-width="1" />

    <text x="10" y="46" fill="#1e293b" font-size="10.5" font-weight="600">tag_id</text>
    <text x="75" y="46" fill="#334155" font-size="10.5">= QR501</text>

    <text x="10" y="64" fill="#1e293b" font-size="10.5" font-weight="600">pet_id</text>
    <text x="75" y="64" fill="#334155" font-size="10.5">= PT401</text>

    <text x="10" y="82" fill="#1e293b" font-size="10.5" font-weight="600">qr_hash</text>
    <text x="75" y="82" fill="#334155" font-size="10.5">= ptv_bruno_8a</text>

    <text x="10" y="100" fill="#1e293b" font-size="10.5" font-weight="600">scan_mode</text>
    <text x="75" y="100" fill="#334155" font-size="10.5">= Public Contact</text>

    <text x="10" y="118" fill="#1e293b" font-size="10.5" font-weight="600">is_active</text>
    <text x="75" y="118" fill="#334155" font-size="10.5">= true</text>

    <text x="10" y="136" fill="#1e293b" font-size="10.5" font-weight="600">status</text>
    <text x="75" y="136" fill="#334155" font-size="10.5">= Active</text>
  </g>

  <!-- Object 7: sos1 : LostAlert (Cyan) -->
  <g transform="translate(700, 350)" filter="url(#shadow)">
    <rect width="180" height="145" rx="6" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5" />
    <rect width="180" height="28" rx="6" fill="#cffafe" />
    <text x="90" y="19" text-anchor="middle" fill="#164e63" font-size="12" font-weight="700">sos1 : LostAlert</text>
    <line x1="0" y1="28" x2="180" y2="28" stroke="#0891b2" stroke-width="1" />

    <text x="10" y="46" fill="#1e293b" font-size="10.5" font-weight="600">alert_id</text>
    <text x="70" y="46" fill="#334155" font-size="10.5">= S601</text>

    <text x="10" y="64" fill="#1e293b" font-size="10.5" font-weight="600">pet_id</text>
    <text x="70" y="64" fill="#334155" font-size="10.5">= PT401</text>

    <text x="10" y="82" fill="#1e293b" font-size="10.5" font-weight="600">category</text>
    <text x="70" y="82" fill="#334155" font-size="10.5">= Lost Dog</text>

    <text x="10" y="100" fill="#1e293b" font-size="10.5" font-weight="600">location</text>
    <text x="70" y="100" fill="#334155" font-size="10.5">= Andheri, Mum</text>

    <text x="10" y="118" fill="#1e293b" font-size="10.5" font-weight="600">beacon</text>
    <text x="70" y="118" fill="#334155" font-size="10.5">= Ready / Standby</text>

    <text x="10" y="136" fill="#1e293b" font-size="10.5" font-weight="600">status</text>
    <text x="70" y="136" fill="#334155" font-size="10.5">= Safe</text>
  </g>

</svg>
