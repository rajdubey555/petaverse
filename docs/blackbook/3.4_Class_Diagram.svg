<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 760" width="100%" height="100%" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Generalization Open White Triangle -->
    <marker id="generalization" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
      <polygon points="1,1 13,7 1,13" fill="#ffffff" stroke="#0284c7" stroke-width="2" />
    </marker>

    <!-- Crisp box shadow -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
  </defs>

  <!-- PURE WHITE BACKGROUND -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Title -->
  <text x="520" y="36" text-anchor="middle" fill="#0f172a" font-size="20" font-weight="800" letter-spacing="0.5">
    3.4 Class Diagram
  </text>

  <!-- ==================== CONNECTING LINES & RELATIONSHIPS ==================== -->

  <!-- 1. Top Overhead Bracket between PetProfile and User -->
  <path d="M 190 170 L 190 75 L 520 75 L 520 170" fill="none" stroke="#1e293b" stroke-width="1.8" />
  <text x="180" y="95" fill="#1e293b" font-size="12" font-weight="700">1</text>
  <text x="530" y="95" fill="#1e293b" font-size="12" font-weight="700">1</text>

  <!-- 2. Horizontal direct link between PetProfile and User (has 0..1 to 0..1) -->
  <line x1="290" y1="275" x2="420" y2="275" stroke="#1e293b" stroke-width="1.8" />
  <text x="355" y="268" text-anchor="middle" fill="#334155" font-size="12" font-weight="600">has</text>
  <text x="305" y="268" fill="#1e293b" font-size="11.5" font-weight="700">0..1</text>
  <text x="385" y="268" fill="#1e293b" font-size="11.5" font-weight="700">0..1</text>

  <!-- 3. User to MedicalRecord (records 1 to *) - CLEAN OVERHEAD ROUTE -->
  <path d="M 440 395 L 440 435 L 190 435 L 190 490" fill="none" stroke="#1e293b" stroke-width="1.8" />
  <text x="320" y="428" text-anchor="middle" fill="#334155" font-size="12" font-weight="600">records</text>
  <text x="448" y="415" fill="#1e293b" font-size="12" font-weight="700">1</text>
  <text x="175" y="475" fill="#1e293b" font-size="12" font-weight="700">*</text>

  <!-- 4. Generalization / Inheritance from Admin & Shelter_Manager to User (PURE BLUE CLEAN HIERARCHY) -->
  <line x1="420" y1="490" x2="420" y2="450" stroke="#0284c7" stroke-width="2" />
  <line x1="620" y1="490" x2="620" y2="450" stroke="#0284c7" stroke-width="2" />
  <line x1="420" y1="450" x2="620" y2="450" stroke="#0284c7" stroke-width="2" />
  <line x1="520" y1="450" x2="520" y2="397" stroke="#0284c7" stroke-width="2" marker-end="url(#generalization)" />

  <!-- 5. User to Report (submits 1 to *) -->
  <path d="M 620 210 L 685 210 L 685 130 L 745 130" fill="none" stroke="#1e293b" stroke-width="1.8" />
  <text x="685" y="185" text-anchor="middle" fill="#334155" font-size="12" font-weight="600">submits</text>
  <text x="628" y="205" fill="#1e293b" font-size="12" font-weight="700">1</text>
  <text x="730" y="122" fill="#1e293b" font-size="12" font-weight="700">*</text>

  <!-- 6. User to SavedPet (creates 1 to *) -->
  <line x1="620" y1="330" x2="745" y2="330" stroke="#1e293b" stroke-width="1.8" />
  <text x="685" y="322" text-anchor="middle" fill="#334155" font-size="12" font-weight="600">creates</text>
  <text x="628" y="322" fill="#1e293b" font-size="12" font-weight="700">1</text>
  <text x="730" y="322" fill="#1e293b" font-size="12" font-weight="700">*</text>

  <!-- 7. User to AdoptionInquiry (requests 1 to *) - CLEAN DOWNWARD ROUTE INTO TOP OF CARD -->
  <path d="M 600 395 L 600 435 L 845 435 L 845 490" fill="none" stroke="#1e293b" stroke-width="1.8" />
  <text x="720" y="428" text-anchor="middle" fill="#334155" font-size="12" font-weight="600">requests</text>
  <text x="608" y="415" fill="#1e293b" font-size="12" font-weight="700">1</text>
  <text x="830" y="475" fill="#1e293b" font-size="12" font-weight="700">*</text>

  <!-- ==================== CLASSES ==================== -->

  <!-- 1. TOP-LEFT: PetProfile -->
  <g transform="translate(90, 170)" filter="url(#shadow)">
    <rect width="200" height="225" rx="5" fill="#ffffff" stroke="#0284c7" stroke-width="1.8" />
    <rect width="200" height="34" rx="5" fill="#0284c7" />
    <circle cx="20" cy="17" r="4.5" fill="#ffffff" />
    <path d="M 12 28 C 12 23 28 23 28 28" fill="#ffffff" />
    <text x="110" y="22" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">PetProfile</text>

    <!-- Attributes -->
    <text x="12" y="52" fill="#334155" font-size="10.5" font-weight="600">+/- petID : ObjectId</text>
    <text x="12" y="68" fill="#334155" font-size="10.5" font-weight="600">- ownerID : ObjectId</text>
    <text x="12" y="84" fill="#334155" font-size="10.5" font-weight="600">- petName : String</text>
    <text x="12" y="100" fill="#334155" font-size="10.5" font-weight="600">- species : String</text>
    <text x="12" y="116" fill="#334155" font-size="10.5" font-weight="600">- breed : String</text>
    <text x="12" y="132" fill="#334155" font-size="10.5" font-weight="600">- qrTagCode : String</text>
    <text x="12" y="148" fill="#334155" font-size="10.5" font-weight="600">- isLostSOS : Boolean</text>

    <line x1="0" y1="156" x2="200" y2="156" stroke="#e2e8f0" stroke-width="1" />

    <!-- Methods (with clean bottom margin) -->
    <circle cx="16" cy="172" r="3" fill="#0284c7" />
    <text x="25" y="176" fill="#0f172a" font-size="10.5" font-weight="600">getPetDetails()</text>

    <circle cx="16" cy="189" r="3" fill="#0284c7" />
    <text x="25" y="193" fill="#0f172a" font-size="10.5" font-weight="600">updateProfile()</text>

    <circle cx="16" cy="206" r="3" fill="#0284c7" />
    <text x="25" y="210" fill="#0f172a" font-size="10.5" font-weight="600">generateQRTag()</text>
  </g>

  <!-- 2. BOTTOM-LEFT: MedicalRecord -->
  <g transform="translate(90, 490)" filter="url(#shadow)">
    <rect width="200" height="225" rx="5" fill="#ffffff" stroke="#0284c7" stroke-width="1.8" />
    <rect width="200" height="34" rx="5" fill="#0284c7" />
    <rect x="12" y="10" width="16" height="14" rx="2" fill="#ffffff" />
    <line x1="16" y1="8" x2="24" y2="8" stroke="#ffffff" stroke-width="2" />
    <text x="110" y="22" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">MedicalRecord</text>

    <!-- Attributes -->
    <text x="12" y="52" fill="#334155" font-size="10.5" font-weight="600">+/- recordID : ObjectId</text>
    <text x="12" y="68" fill="#334155" font-size="10.5" font-weight="600">+ petID : ObjectId</text>
    <text x="12" y="84" fill="#334155" font-size="10.5" font-weight="600">- vaccineName : String</text>
    <text x="12" y="100" fill="#334155" font-size="10.5" font-weight="600">- dateGiven : Date</text>
    <text x="12" y="116" fill="#334155" font-size="10.5" font-weight="600">- vetName : String</text>
    <text x="12" y="132" fill="#334155" font-size="10.5" font-weight="600">- nextDueDate : Date</text>
    <text x="12" y="148" fill="#334155" font-size="10.5" font-weight="600">- isVerified : Boolean</text>

    <line x1="0" y1="156" x2="200" y2="156" stroke="#e2e8f0" stroke-width="1" />

    <!-- Methods (with clean bottom margin) -->
    <circle cx="16" cy="172" r="3" fill="#0284c7" />
    <text x="25" y="176" fill="#0f172a" font-size="10.5" font-weight="600">recordVaccine()</text>

    <circle cx="16" cy="189" r="3" fill="#0284c7" />
    <text x="25" y="193" fill="#0f172a" font-size="10.5" font-weight="600">getHistory()</text>

    <circle cx="16" cy="206" r="3" fill="#0284c7" />
    <text x="25" y="210" fill="#0f172a" font-size="10.5" font-weight="600">checkUpcoming()</text>
  </g>

  <!-- 3. CENTER: User (Superclass) -->
  <g transform="translate(420, 170)" filter="url(#shadow)">
    <rect width="200" height="225" rx="5" fill="#ffffff" stroke="#0284c7" stroke-width="1.8" />
    <rect width="200" height="34" rx="5" fill="#0284c7" />
    <circle cx="20" cy="17" r="4.5" fill="#ffffff" />
    <path d="M 12 28 C 12 23 28 23 28 28" fill="#ffffff" />
    <text x="110" y="22" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">User</text>

    <!-- Attributes -->
    <text x="12" y="52" fill="#334155" font-size="11" font-weight="600">+ userID : ObjectId</text>
    <text x="12" y="68" fill="#334155" font-size="11" font-weight="600">+ username : String</text>
    <text x="12" y="84" fill="#334155" font-size="11" font-weight="600">- password : String</text>
    <text x="12" y="100" fill="#334155" font-size="11" font-weight="600">- role : String</text>
    <text x="12" y="116" fill="#334155" font-size="11" font-weight="600">- email : String</text>
    <text x="12" y="132" fill="#334155" font-size="11" font-weight="600">- active : Boolean</text>

    <line x1="0" y1="140" x2="200" y2="140" stroke="#e2e8f0" stroke-width="1" />

    <!-- Methods (with clean bottom margin) -->
    <circle cx="16" cy="155" r="3" fill="#0284c7" />
    <text x="25" y="159" fill="#0f172a" font-size="10.5" font-weight="600">login()</text>

    <circle cx="16" cy="171" r="3" fill="#0284c7" />
    <text x="25" y="175" fill="#0f172a" font-size="10.5" font-weight="600">logout()</text>

    <circle cx="16" cy="187" r="3" fill="#0284c7" />
    <text x="25" y="191" fill="#0f172a" font-size="10.5" font-weight="600">updateProfile()</text>

    <circle cx="16" cy="203" r="3" fill="#0284c7" />
    <text x="25" y="207" fill="#0f172a" font-size="10.5" font-weight="600">changePassword()</text>
  </g>

  <!-- 4. BOTTOM-CENTER-LEFT: Admin (Subclass) -->
  <g transform="translate(330, 490)" filter="url(#shadow)">
    <rect width="180" height="165" rx="5" fill="#ffffff" stroke="#0284c7" stroke-width="1.8" />
    <rect width="180" height="32" rx="5" fill="#0284c7" />
    <circle cx="20" cy="16" r="4.5" fill="#ffffff" />
    <path d="M 12 27 C 12 22 28 22 28 27" fill="#ffffff" />
    <text x="100" y="21" text-anchor="middle" fill="#ffffff" font-size="13.5" font-weight="700">Admin</text>

    <!-- Attributes -->
    <text x="12" y="52" fill="#334155" font-size="10.5" font-weight="600">+/- userID : ObjectId</text>
    <text x="12" y="68" fill="#334155" font-size="10.5" font-weight="600">+ username : String</text>
    <text x="12" y="84" fill="#334155" font-size="10.5" font-weight="600">- password : String</text>
    <text x="12" y="100" fill="#334155" font-size="10.5" font-weight="600">- email : String</text>

    <line x1="0" y1="108" x2="180" y2="108" stroke="#e2e8f0" stroke-width="1" />

    <!-- Methods (with clean bottom margin) -->
    <circle cx="16" cy="125" r="3" fill="#0284c7" />
    <text x="25" y="129" fill="#0f172a" font-size="10.5" font-weight="600">login()</text>

    <circle cx="16" cy="144" r="3" fill="#0284c7" />
    <text x="25" y="148" fill="#0f172a" font-size="10.5" font-weight="600">getPlatformStats()</text>
  </g>

  <!-- 5. BOTTOM-CENTER-RIGHT: Shelter_Manager (Subclass) -->
  <g transform="translate(530, 490)" filter="url(#shadow)">
    <rect width="180" height="165" rx="5" fill="#ffffff" stroke="#0284c7" stroke-width="1.8" />
    <rect width="180" height="32" rx="5" fill="#0284c7" />
    <circle cx="20" cy="16" r="4.5" fill="#ffffff" />
    <path d="M 12 27 C 12 22 28 22 28 27" fill="#ffffff" />
    <text x="105" y="21" text-anchor="middle" fill="#ffffff" font-size="13.5" font-weight="700">Shelter_Manager</text>

    <!-- Attributes -->
    <text x="12" y="52" fill="#334155" font-size="10.5" font-weight="600">+/- userID : ObjectId</text>
    <text x="12" y="68" fill="#334155" font-size="10.5" font-weight="600">+ username : String</text>
    <text x="12" y="84" fill="#334155" font-size="10.5" font-weight="600">- password : String</text>
    <text x="12" y="100" fill="#334155" font-size="10.5" font-weight="600">- email : String</text>

    <line x1="0" y1="108" x2="180" y2="108" stroke="#e2e8f0" stroke-width="1" />

    <!-- Methods (with clean bottom margin) -->
    <circle cx="16" cy="125" r="3" fill="#0284c7" />
    <text x="25" y="129" fill="#0f172a" font-size="10.5" font-weight="600">login()</text>

    <circle cx="16" cy="144" r="3" fill="#0284c7" />
    <text x="25" y="148" fill="#0f172a" font-size="10.5" font-weight="600">approveAdoption()</text>
  </g>

  <!-- 6. TOP-RIGHT: Report (Ticket) -->
  <g transform="translate(745, 50)" filter="url(#shadow)">
    <rect width="200" height="185" rx="5" fill="#ffffff" stroke="#0284c7" stroke-width="1.8" />
    <rect width="200" height="32" rx="5" fill="#0284c7" />
    <rect x="14" y="10" width="14" height="12" rx="2" fill="#ffffff" />
    <text x="110" y="21" text-anchor="middle" fill="#ffffff" font-size="13.5" font-weight="700">Report</text>

    <!-- Attributes -->
    <text x="12" y="50" fill="#334155" font-size="10.5" font-weight="600">+/- reportID : ObjectId</text>
    <text x="12" y="66" fill="#334155" font-size="10.5" font-weight="600">+ userID : ObjectId</text>
    <text x="12" y="82" fill="#334155" font-size="10.5" font-weight="600">- reason : String</text>
    <text x="12" y="98" fill="#334155" font-size="10.5" font-weight="600">- status : String</text>
    <text x="12" y="114" fill="#334155" font-size="10.5" font-weight="600">- submittedDate : Date</text>

    <line x1="0" y1="122" x2="200" y2="122" stroke="#e2e8f0" stroke-width="1" />

    <!-- Methods (with clean bottom margin) -->
    <circle cx="16" cy="138" r="3" fill="#0284c7" />
    <text x="25" y="142" fill="#0f172a" font-size="10.5" font-weight="600">submitReport()</text>

    <circle cx="16" cy="154" r="3" fill="#0284c7" />
    <text x="25" y="158" fill="#0f172a" font-size="10.5" font-weight="600">updateStatus()</text>

    <circle cx="16" cy="170" r="3" fill="#0284c7" />
    <text x="25" y="174" fill="#0f172a" font-size="10.5" font-weight="600">resolveReport()</text>
  </g>

  <!-- 7. MIDDLE-RIGHT: SavedPet (Post) -->
  <g transform="translate(745, 250)" filter="url(#shadow)">
    <rect width="200" height="185" rx="5" fill="#ffffff" stroke="#0284c7" stroke-width="1.8" />
    <rect width="200" height="32" rx="5" fill="#0284c7" />
    <rect x="14" y="10" width="14" height="12" rx="2" fill="#ffffff" />
    <text x="110" y="21" text-anchor="middle" fill="#ffffff" font-size="13.5" font-weight="700">SavedPet</text>

    <!-- Attributes -->
    <text x="12" y="50" fill="#334155" font-size="10.5" font-weight="600">+ saveID : ObjectId</text>
    <text x="12" y="66" fill="#334155" font-size="10.5" font-weight="600">- userID : ObjectId</text>
    <text x="12" y="82" fill="#334155" font-size="10.5" font-weight="600">- petID : ObjectId</text>
    <text x="12" y="98" fill="#334155" font-size="10.5" font-weight="600">- category : String</text>
    <text x="12" y="114" fill="#334155" font-size="10.5" font-weight="600">- savedDate : Date</text>

    <line x1="0" y1="122" x2="200" y2="122" stroke="#e2e8f0" stroke-width="1" />

    <!-- Methods (with clean bottom margin) -->
    <circle cx="16" cy="138" r="3" fill="#0284c7" />
    <text x="25" y="142" fill="#0f172a" font-size="10.5" font-weight="600">addBookmark()</text>

    <circle cx="16" cy="154" r="3" fill="#0284c7" />
    <text x="25" y="158" fill="#0f172a" font-size="10.5" font-weight="600">removeBookmark()</text>

    <circle cx="16" cy="170" r="3" fill="#0284c7" />
    <text x="25" y="174" fill="#0f172a" font-size="10.5" font-weight="600">viewSavedList()</text>
  </g>

  <!-- 8. BOTTOM-RIGHT: AdoptionInquiry (Leave) -->
  <g transform="translate(745, 490)" filter="url(#shadow)">
    <rect width="200" height="185" rx="5" fill="#ffffff" stroke="#0284c7" stroke-width="1.8" />
    <rect width="200" height="32" rx="5" fill="#0284c7" />
    <rect x="14" y="10" width="14" height="12" rx="2" fill="#ffffff" />
    <text x="110" y="21" text-anchor="middle" fill="#ffffff" font-size="13.5" font-weight="700">AdoptionInquiry</text>

    <!-- Attributes -->
    <text x="12" y="50" fill="#334155" font-size="10.5" font-weight="600">+/- inquiryID : ObjectId</text>
    <text x="12" y="66" fill="#334155" font-size="10.5" font-weight="600">+ userID : ObjectId</text>
    <text x="12" y="82" fill="#334155" font-size="10.5" font-weight="600">- petID : ObjectId</text>
    <text x="12" y="98" fill="#334155" font-size="10.5" font-weight="600">- status : String</text>
    <text x="12" y="114" fill="#334155" font-size="10.5" font-weight="600">- requestDate : Date</text>

    <line x1="0" y1="122" x2="200" y2="122" stroke="#e2e8f0" stroke-width="1" />

    <!-- Methods (with clean bottom margin) -->
    <circle cx="16" cy="138" r="3" fill="#0284c7" />
    <text x="25" y="142" fill="#0f172a" font-size="10.5" font-weight="600">requestAdoption()</text>

    <circle cx="16" cy="154" r="3" fill="#0284c7" />
    <text x="25" y="158" fill="#0f172a" font-size="10.5" font-weight="600">cancelInquiry()</text>

    <circle cx="16" cy="170" r="3" fill="#0284c7" />
    <text x="25" y="174" fill="#0f172a" font-size="10.5" font-weight="600">approveInquiry()</text>
  </g>

</svg>
