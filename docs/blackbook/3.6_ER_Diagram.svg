<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 940" width="100%" height="100%" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
