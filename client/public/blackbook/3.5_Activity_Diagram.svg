<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1140" width="100%" height="100%" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- PURE WHITE BACKGROUND -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Diagram Title -->
  <text x="800" y="34" text-anchor="middle" fill="#0f172a" font-size="22" font-weight="800" letter-spacing="0.5">
    3.5 Activity Diagram - Petaverse Workflows
  </text>

  <!-- ==================== FLOW 1: AUTHENTICATION FLOW (CENTER X = 800) ==================== -->

  <!-- Start Node -->
  <circle cx="800" cy="62" r="14" fill="#0f172a" />
  <text x="828" y="67" fill="#0f172a" font-size="13" font-weight="700">Start</text>

  <!-- Arrow Start -> Access Portal -->
  <line x1="800" y1="76" x2="800" y2="102" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- Action: Access Portal -->
  <g transform="translate(650, 102)" filter="url(#shadow)">
    <rect width="300" height="42" rx="8" fill="#1e3a8a" />
    <text x="150" y="26" text-anchor="middle" fill="#ffffff" font-size="13.5" font-weight="600">Access Petaverse Portal</text>
  </g>

  <!-- Arrow Access Portal -> Decision Registered -->
  <line x1="800" y1="144" x2="800" y2="175" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- Decision: Is User Registered? -->
  <g transform="translate(710, 175)">
    <polygon points="90,0 180,30 90,60 0,30" fill="#f8fafc" stroke="#1e3a8a" stroke-width="2" />
    <text x="90" y="27" text-anchor="middle" fill="#0f172a" font-size="11.5" font-weight="700">Is User</text>
    <text x="90" y="42" text-anchor="middle" fill="#0f172a" font-size="11.5" font-weight="700">Registered?</text>
  </g>

  <!-- Branch No -> Register -->
  <path d="M 710 205 L 490 205 L 490 248" fill="none" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="600" y="198" text-anchor="middle" fill="#ef4444" font-size="12" font-weight="700">No</text>

  <!-- Action: Register -->
  <g transform="translate(365, 248)" filter="url(#shadow)">
    <rect width="250" height="48" rx="8" fill="#1e3a8a" />
    <text x="125" y="21" text-anchor="middle" fill="#ffffff" font-size="12.5" font-weight="600">Sign Up / Register</text>
    <text x="125" y="38" text-anchor="middle" fill="#bfdbfe" font-size="11">(Name, Email, Password)</text>
  </g>

  <!-- Branch Yes -> Login -->
  <line x1="800" y1="235" x2="800" y2="248" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="815" y="245" fill="#16a34a" font-size="12" font-weight="700">Yes</text>

  <!-- Action: Login -->
  <g transform="translate(675, 248)" filter="url(#shadow)">
    <rect width="250" height="48" rx="8" fill="#1e3a8a" />
    <text x="125" y="21" text-anchor="middle" fill="#ffffff" font-size="12.5" font-weight="600">Login to Account</text>
    <text x="125" y="38" text-anchor="middle" fill="#bfdbfe" font-size="11">(Email, Password / Google)</text>
  </g>

  <!-- Join from Register to Authenticate -->
  <path d="M 490 296 L 490 358 L 650 358" fill="none" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- Arrow Login -> Authenticate -->
  <line x1="800" y1="296" x2="800" y2="337" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- Action: Authenticate Credentials -->
  <g transform="translate(650, 337)" filter="url(#shadow)">
    <rect width="300" height="42" rx="8" fill="#1e3a8a" />
    <text x="150" y="26" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">Authenticate Credentials (JWT)</text>
  </g>

  <!-- Arrow Authenticate -> Decision Successful -->
  <line x1="800" y1="379" x2="800" y2="408" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- Decision: Auth Successful? -->
  <g transform="translate(705, 408)">
    <polygon points="95,0 190,30 95,60 0,30" fill="#f8fafc" stroke="#1e3a8a" stroke-width="2" />
    <text x="95" y="27" text-anchor="middle" fill="#0f172a" font-size="11.5" font-weight="700">Authentication</text>
    <text x="95" y="42" text-anchor="middle" fill="#0f172a" font-size="11.5" font-weight="700">Successful?</text>
  </g>

  <!-- Branch No -> Error & Retry -->
  <path d="M 895 438 L 1020 438" fill="none" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="955" y="430" fill="#ef4444" font-size="12" font-weight="700">No</text>

  <g transform="translate(1020, 416)" filter="url(#shadow)">
    <rect width="200" height="44" rx="8" fill="#b91c1c" />
    <text x="100" y="20" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="600">Show Error Message</text>
    <text x="100" y="35" text-anchor="middle" fill="#fecaca" font-size="11">&amp; Prompt Retry</text>
  </g>
  <!-- Retry Loop back -->
  <path d="M 1120 416 L 1120 272 L 925 272" fill="none" stroke="#1e293b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)" />

  <!-- Branch Yes -> Dashboard -->
  <line x1="800" y1="468" x2="800" y2="500" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="815" y="488" fill="#16a34a" font-size="12" font-weight="700">Yes</text>

  <!-- Action: View Dashboard -->
  <g transform="translate(560, 500)" filter="url(#shadow)">
    <rect width="480" height="48" rx="8" fill="#0f766e" />
    <text x="240" y="22" text-anchor="middle" fill="#ffffff" font-size="14.5" font-weight="700">View Petaverse Main Dashboard</text>
    <text x="240" y="39" text-anchor="middle" fill="#ccfbf1" font-size="11.5">(Pet Catalog, QR Tag Status, Lost SOS Beacon)</text>
  </g>

  <!-- Arrow Dashboard -> Fork Bar -->
  <line x1="800" y1="548" x2="800" y2="580" stroke="#1e293b" stroke-width="2.2" marker-end="url(#arrow)" />

  <!-- ==================== FORK BAR (Thick Synchronization Line) ==================== -->
  <rect x="70" y="580" width="1460" height="8" rx="4" fill="#0f172a" />

  <!-- 5 Branch Lines from Fork Bar -->
  <!-- Col 1 (210) | Col 2 (530) | Col 3 (850) | Col 4 (1170) | Col 5 (1410) -->
  <line x1="210" y1="588" x2="210" y2="618" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)" />
  <line x1="530" y1="588" x2="530" y2="618" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)" />
  <line x1="850" y1="588" x2="850" y2="618" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)" />
  <line x1="1170" y1="588" x2="1170" y2="618" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)" />
  <line x1="1410" y1="588" x2="1410" y2="618" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- ==================== COLUMN 1: PET SAFETY & QR (Center x: 210) ==================== -->
  <g transform="translate(100, 618)" filter="url(#shadow)">
    <rect width="220" height="42" rx="6" fill="#1e3a8a" />
    <text x="110" y="26" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">Pet Safety &amp; QR Tag</text>
  </g>
  <line x1="210" y1="660" x2="210" y2="690" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- Decision: Generate or Scan? -->
  <g transform="translate(135, 690)">
    <polygon points="75,0 150,26 75,52 0,26" fill="#f8fafc" stroke="#1e3a8a" stroke-width="1.8" />
    <text x="75" y="23" text-anchor="middle" fill="#0f172a" font-size="11" font-weight="700">Generate or</text>
    <text x="75" y="37" text-anchor="middle" fill="#0f172a" font-size="11" font-weight="700">Scan QR?</text>
  </g>

  <!-- Left Branch: Generate QR (Child Center: 130) -->
  <path d="M 135 716 L 130 716 L 130 762" fill="none" stroke="#1e293b" stroke-width="1.6" marker-end="url(#arrow)" />
  <text x="105" y="709" fill="#1e293b" font-size="10.5" font-weight="700">Generate</text>
  <g transform="translate(68, 762)" filter="url(#shadow)">
    <rect width="124" height="54" rx="6" fill="#1e40af" />
    <text x="62" y="19" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="600">Download</text>
    <text x="62" y="34" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="600">QR Tag Card</text>
    <text x="62" y="47" text-anchor="middle" fill="#bfdbfe" font-size="9.5">(Collar Tag)</text>
  </g>

  <!-- Right Branch: Scan QR (Child Center: 290) -->
  <path d="M 285 716 L 290 716 L 290 762" fill="none" stroke="#1e293b" stroke-width="1.6" marker-end="url(#arrow)" />
  <text x="295" y="709" fill="#1e293b" font-size="10.5" font-weight="700">Scan</text>
  <g transform="translate(228, 762)" filter="url(#shadow)">
    <rect width="124" height="54" rx="6" fill="#1e40af" />
    <text x="62" y="19" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="600">Scan Collar QR</text>
    <text x="62" y="34" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="600">&amp; Contact</text>
    <text x="62" y="47" text-anchor="middle" fill="#bfdbfe" font-size="9.5">(Emergency Info)</text>
  </g>

  <!-- Rejoin col 1 -->
  <path d="M 130 816 L 130 855 L 210 855" fill="none" stroke="#1e293b" stroke-width="1.6" />
  <path d="M 290 816 L 290 855 L 210 855" fill="none" stroke="#1e293b" stroke-width="1.6" />
  <line x1="210" y1="855" x2="210" y2="925" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- ==================== COLUMN 2: LOST PET SOS (Center x: 530) ==================== -->
  <g transform="translate(420, 618)" filter="url(#shadow)">
    <rect width="220" height="42" rx="6" fill="#1e3a8a" />
    <text x="110" y="26" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">Lost Pet SOS Beacon</text>
  </g>
  <line x1="530" y1="660" x2="530" y2="690" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- Decision: SOS Trigger or View? -->
  <g transform="translate(450, 690)">
    <polygon points="80,0 160,26 80,52 0,26" fill="#f8fafc" stroke="#1e3a8a" stroke-width="1.8" />
    <text x="80" y="23" text-anchor="middle" fill="#0f172a" font-size="11" font-weight="700">Trigger Alert</text>
    <text x="80" y="37" text-anchor="middle" fill="#0f172a" font-size="11" font-weight="700">or View Map?</text>
  </g>

  <!-- Left Branch: Activate SOS Beacon (Child Center: 450) -->
  <path d="M 450 716 L 450 762" fill="none" stroke="#1e293b" stroke-width="1.6" marker-end="url(#arrow)" />
  <text x="410" y="709" fill="#1e293b" font-size="10.5" font-weight="700">Trigger</text>
  <g transform="translate(388, 762)" filter="url(#shadow)">
    <rect width="124" height="54" rx="6" fill="#dc2626" />
    <text x="62" y="19" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">Activate SOS</text>
    <text x="62" y="34" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="600">Beacon Alert</text>
    <text x="62" y="47" text-anchor="middle" fill="#fee2e2" font-size="9.5">(Broadcast)</text>
  </g>

  <!-- Right Branch: View Map (Child Center: 610) -->
  <path d="M 610 716 L 610 762" fill="none" stroke="#1e293b" stroke-width="1.6" marker-end="url(#arrow)" />
  <text x="625" y="709" fill="#1e293b" font-size="10.5" font-weight="700">View</text>
  <g transform="translate(548, 762)" filter="url(#shadow)">
    <rect width="124" height="54" rx="6" fill="#1e40af" />
    <text x="62" y="19" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="600">View Live</text>
    <text x="62" y="34" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="600">Lost/Found</text>
    <text x="62" y="47" text-anchor="middle" fill="#bfdbfe" font-size="9.5">(Community Map)</text>
  </g>

  <!-- Rejoin col 2 -->
  <path d="M 450 816 L 450 855 L 530 855" fill="none" stroke="#1e293b" stroke-width="1.6" />
  <path d="M 610 816 L 610 855 L 530 855" fill="none" stroke="#1e293b" stroke-width="1.6" />
  <line x1="530" y1="855" x2="530" y2="925" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- ==================== COLUMN 3: PROFILE & PET RECORDS (Center x: 850) ==================== -->
  <g transform="translate(740, 618)" filter="url(#shadow)">
    <rect width="220" height="42" rx="6" fill="#1e3a8a" />
    <text x="110" y="26" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">Profile &amp; Pet Records</text>
  </g>
  <line x1="850" y1="660" x2="850" y2="690" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- Decision: Edit or Return? -->
  <g transform="translate(775, 690)">
    <polygon points="75,0 150,26 75,52 0,26" fill="#f8fafc" stroke="#1e3a8a" stroke-width="1.8" />
    <text x="75" y="23" text-anchor="middle" fill="#0f172a" font-size="11" font-weight="700">Edit Details</text>
    <text x="75" y="37" text-anchor="middle" fill="#0f172a" font-size="11" font-weight="700">or Return?</text>
  </g>

  <!-- Left Branch: Update Details (Child Center: 770) -->
  <path d="M 775 716 L 770 716 L 770 762" fill="none" stroke="#1e293b" stroke-width="1.6" marker-end="url(#arrow)" />
  <text x="745" y="709" fill="#1e293b" font-size="10.5" font-weight="700">Edit</text>
  <g transform="translate(708, 762)" filter="url(#shadow)">
    <rect width="124" height="54" rx="6" fill="#1e40af" />
    <text x="62" y="19" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="600">Update Pet /</text>
    <text x="62" y="34" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="600">User Profile</text>
    <text x="62" y="47" text-anchor="middle" fill="#bfdbfe" font-size="9.5">(Saved to DB)</text>
  </g>

  <!-- Right Branch: Keep / Return (Child Center: 930) -->
  <path d="M 925 716 L 930 716 L 930 762" fill="none" stroke="#1e293b" stroke-width="1.6" marker-end="url(#arrow)" />
  <text x="940" y="709" fill="#1e293b" font-size="10.5" font-weight="700">Keep</text>
  <g transform="translate(868, 762)" filter="url(#shadow)">
    <rect width="124" height="54" rx="6" fill="#1e40af" />
    <text x="62" y="22" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="600">Keep Current</text>
    <text x="62" y="38" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="600">Information</text>
    <text x="62" y="49" text-anchor="middle" fill="#bfdbfe" font-size="9">(Dashboard)</text>
  </g>

  <!-- Rejoin col 3 -->
  <path d="M 770 816 L 770 855 L 850 855" fill="none" stroke="#1e293b" stroke-width="1.6" />
  <path d="M 930 816 L 930 855 L 850 855" fill="none" stroke="#1e293b" stroke-width="1.6" />
  <line x1="850" y1="855" x2="850" y2="925" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- ==================== COLUMN 4: BROWSE ADOPTIONS (Center x: 1170) ==================== -->
  <g transform="translate(1075, 618)" filter="url(#shadow)">
    <rect width="190" height="42" rx="6" fill="#1e3a8a" />
    <text x="95" y="26" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">Browse Adoptions</text>
  </g>
  <line x1="1170" y1="660" x2="1170" y2="695" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- Step 1: Filter Listings -->
  <g transform="translate(1080, 695)" filter="url(#shadow)">
    <rect width="180" height="46" rx="6" fill="#1e40af" />
    <text x="90" y="20" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="600">Filter by Breed,</text>
    <text x="90" y="35" text-anchor="middle" fill="#bfdbfe" font-size="10.5">Species &amp; Location</text>
  </g>
  <line x1="1170" y1="741" x2="1170" y2="770" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- Step 2: Submit Inquiry -->
  <g transform="translate(1080, 770)" filter="url(#shadow)">
    <rect width="180" height="50" rx="6" fill="#1e40af" />
    <text x="90" y="21" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="600">Submit Adoption</text>
    <text x="90" y="37" text-anchor="middle" fill="#bfdbfe" font-size="10.5">Inquiry Application</text>
  </g>
  <line x1="1170" y1="820" x2="1170" y2="925" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- ==================== COLUMN 5: COMMUNITY HELP & REPORTS (Center x: 1410) ==================== -->
  <g transform="translate(1310, 618)" filter="url(#shadow)">
    <rect width="200" height="42" rx="6" fill="#1e3a8a" />
    <text x="100" y="26" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">Community Help &amp; Reports</text>
  </g>
  <line x1="1410" y1="660" x2="1410" y2="695" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- Step 1: Submit Report -->
  <g transform="translate(1320, 695)" filter="url(#shadow)">
    <rect width="180" height="46" rx="6" fill="#1e40af" />
    <text x="90" y="20" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="600">Report Inappropriate</text>
    <text x="90" y="35" text-anchor="middle" fill="#bfdbfe" font-size="10.5">Listing / User</text>
  </g>
  <line x1="1410" y1="741" x2="1410" y2="770" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- Step 2: Track Resolution -->
  <g transform="translate(1320, 770)" filter="url(#shadow)">
    <rect width="180" height="50" rx="6" fill="#1e40af" />
    <text x="90" y="21" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="600">Track Resolution</text>
    <text x="90" y="37" text-anchor="middle" fill="#bfdbfe" font-size="10.5">&amp; Ticket Status</text>
  </g>
  <line x1="1410" y1="820" x2="1410" y2="925" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- ==================== JOIN BAR (Thick Synchronization Line) ==================== -->
  <rect x="70" y="925" width="1460" height="8" rx="4" fill="#0f172a" />

  <!-- Arrow Join Bar -> Logout -->
  <line x1="800" y1="933" x2="800" y2="968" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Action: Logout -->
  <g transform="translate(680, 968)" filter="url(#shadow)">
    <rect width="240" height="44" rx="8" fill="#1e3a8a" />
    <text x="120" y="27" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">Logout / End Session</text>
  </g>

  <!-- Arrow Logout -> End -->
  <line x1="800" y1="1012" x2="800" y2="1046" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)" />

  <!-- End Node (Bullseye Circle) -->
  <circle cx="800" cy="1062" r="15" fill="none" stroke="#0f172a" stroke-width="2" />
  <circle cx="800" cy="1062" r="10" fill="#0f172a" />
  <text x="828" y="1067" fill="#0f172a" font-size="13" font-weight="700">End</text>
</svg>