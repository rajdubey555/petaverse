<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 920" width="100%" height="100%" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Arrow Marker Gray -->
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b" />
    </marker>
    <!-- Arrow Marker Dashed -->
    <marker id="arrow-dash" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284c7" />
    </marker>
    <!-- Drop Shadow -->
    <filter id="soft-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
  </defs>

  <!-- PURE WHITE BACKGROUND -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- ==================== CONNECTING LINES ==================== -->

  <!-- Line 1: MongoDB -> Database response -> Express Server (Sends Response) -->
  <line x1="390" y1="130" x2="390" y2="185" stroke="#64748b" stroke-width="1.8" />
  <line x1="390" y1="219" x2="390" y2="280" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- Line 2: Express Server (Sends Response) -> HTTP response (JSON) -> React User Box -->
  <line x1="390" y1="350" x2="390" y2="425" stroke="#64748b" stroke-width="1.8" />
  <path d="M 390 459 L 390 495 L 430 495 L 430 530" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- Line 3: UI is updated! Badge -> Dashed line into React Box -->
  <path d="M 590 442 L 590 495 L 530 495 L 530 530" fill="none" stroke="#0284c7" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrow-dash)" />

  <!-- Line 4: React User Box -> Data sent via HTTP (REST / JSON) -> Express Server (Processes Request) -->
  <line x1="390" y1="600" x2="390" y2="655" stroke="#64748b" stroke-width="1.8" />
  <line x1="390" y1="689" x2="390" y2="760" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- Line 5: Express Server (Processes Request) -> Query to database -> MongoDB Return Loop -->
  <path d="M 270 760 L 270 710 L 210 710 L 210 689" fill="none" stroke="#64748b" stroke-width="1.8" />
  <path d="M 210 655 L 210 635 L 120 635 L 120 100 L 250 100" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- ==================== LABEL BOXES ==================== -->

  <!-- Label 1: Database response -->
  <g transform="translate(315, 185)">
    <rect width="150" height="34" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.4" />
    <text x="75" y="22" text-anchor="middle" fill="#475569" font-size="12" font-weight="600">Database response</text>
  </g>

  <!-- Label 2: HTTP response (JSON) -->
  <g transform="translate(305, 425)">
    <rect width="170" height="34" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.4" />
    <text x="85" y="22" text-anchor="middle" fill="#475569" font-size="12" font-weight="600">HTTP response (JSON)</text>
  </g>

  <!-- Label 3: Data sent via HTTP (REST / JSON) -->
  <g transform="translate(285, 655)">
    <rect width="210" height="34" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.4" />
    <text x="105" y="22" text-anchor="middle" fill="#475569" font-size="12" font-weight="600">Data sent via HTTP (REST / JSON)</text>
  </g>

  <!-- Label 4: Query to database -->
  <g transform="translate(135, 655)">
    <rect width="150" height="34" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.4" />
    <text x="75" y="22" text-anchor="middle" fill="#475569" font-size="12" font-weight="600">Query to database</text>
  </g>

  <!-- ==================== MAIN CARDS ==================== -->

  <!-- 1. TOP CARD: MongoDB & Cloudinary -->
  <g transform="translate(250, 70)" filter="url(#soft-shadow)">
    <rect width="280" height="60" rx="3" fill="#fefce8" stroke="#ca8a04" stroke-width="2" />
    <text x="140" y="26" text-anchor="middle" fill="#78350f" font-size="14.5" font-weight="700">MongoDB &amp; Cloudinary</text>
    <text x="140" y="47" text-anchor="middle" fill="#0f172a" font-size="13" font-weight="600">stores / retrieves data</text>
  </g>

  <!-- 2. SECOND CARD: Express Server (sends response) -->
  <g transform="translate(240, 280)" filter="url(#soft-shadow)">
    <rect width="300" height="70" rx="3" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" />
    <text x="150" y="30" text-anchor="middle" fill="#0f172a" font-size="14.5" font-weight="700">Express server receives</text>
    <text x="150" y="52" text-anchor="middle" fill="#0f172a" font-size="14" font-weight="700">and sends response</text>
  </g>

  <!-- 3. UI NOTIFICATION BADGE: "UI is updated!" (NO EMOJI) -->
  <g transform="translate(500, 412)" filter="url(#soft-shadow)">
    <rect width="180" height="36" rx="3" fill="#0284c7" />
    <text x="90" y="23" text-anchor="middle" fill="#ffffff" font-size="13.5" font-weight="700" letter-spacing="0.3">UI is updated!</text>
  </g>

  <!-- 4. THIRD CARD: React User Form / Interaction -->
  <g transform="translate(200, 530)" filter="url(#soft-shadow)">
    <rect width="380" height="70" rx="3" fill="#f0f9ff" stroke="#0284c7" stroke-width="2" />
    <text x="190" y="30" text-anchor="middle" fill="#0f172a" font-size="14.5" font-weight="700">User fills out form / interacts in React</text>
    <text x="190" y="51" text-anchor="middle" fill="#0369a1" font-size="12.5" font-weight="600">(Pet Registration, QR Scan, Lost SOS)</text>
  </g>

  <!-- 5. FOURTH CARD: Express Server (processes request) -->
  <g transform="translate(240, 760)" filter="url(#soft-shadow)">
    <rect width="300" height="70" rx="3" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" />
    <text x="150" y="30" text-anchor="middle" fill="#0f172a" font-size="14.5" font-weight="700">Express server receives</text>
    <text x="150" y="52" text-anchor="middle" fill="#0f172a" font-size="14" font-weight="700">and processes request</text>
  </g>
</svg>