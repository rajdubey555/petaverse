<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 580" width="100%" height="100%" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Shadow Filter -->
    <filter id="card-shadow" x="-8%" y="-8%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08" />
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.04" />
    </filter>
    <filter id="pill-shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0284c7" flood-opacity="0.25" />
    </filter>

    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569" />
    </marker>
  </defs>

  <!-- PURE WHITE BACKGROUND -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Outer Canvas Container Border with Ample Margin -->
  <rect x="25" y="20" width="890" height="540" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.6" />

  <!-- ==================== CONNECTING ARROWS ==================== -->
  
  <!-- 1. Left (React) to Top (Express) -->
  <path d="M 235 210 L 235 125 Q 235 105 255 105 L 360 105" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#arrow)" />
  <text x="270" y="140" fill="#475569" font-size="12" font-weight="600" text-anchor="middle">Data sent</text>
  <text x="270" y="157" fill="#475569" font-size="12" font-weight="600" text-anchor="middle">via HTTP (REST / JWT)</text>

  <!-- 2. Top (Express) to Right (MongoDB) -->
  <path d="M 580 105 L 675 105 Q 695 105 695 125 L 695 210" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#arrow)" />
  <text x="645" y="135" fill="#475569" font-size="12" font-weight="600" text-anchor="middle">Query / Mutate</text>
  <text x="645" y="152" fill="#475569" font-size="12" font-weight="600" text-anchor="middle">Database</text>

  <!-- 3. Right (MongoDB) to Bottom (Express) -->
  <path d="M 695 310 L 695 390 Q 695 410 675 410 L 580 410" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#arrow)" />
  <text x="645" y="365" fill="#475569" font-size="12" font-weight="600" text-anchor="middle">Database</text>
  <text x="645" y="382" fill="#475569" font-size="12" font-weight="600" text-anchor="middle">Response</text>

  <!-- 4. Bottom (Express) to Left (React) -->
  <path d="M 360 410 L 255 410 Q 235 410 235 390 L 235 310" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#arrow)" />
  <text x="270" y="365" fill="#475569" font-size="12" font-weight="600" text-anchor="middle">HTTP JSON</text>
  <text x="270" y="382" fill="#475569" font-size="12" font-weight="600" text-anchor="middle">Response</text>

  <!-- ==================== NODES / CARDS ==================== -->

  <!-- TOP CARD: Express Server (Request Processing) -->
  <g transform="translate(360, 65)">
    <rect width="220" height="80" rx="12" fill="#ffffff" stroke="#334155" stroke-width="1.8" filter="url(#card-shadow)" />
    <!-- Node.js / Express Hexagon Icon -->
    <g transform="translate(16, 18)">
      <polygon points="22,4 40,14 40,36 22,46 4,36 4,14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" />
      <text x="22" y="29" font-size="13" font-weight="bold" fill="#15803d" text-anchor="middle">JS</text>
    </g>
    <text x="74" y="36" fill="#1e293b" font-size="12.5" font-weight="600">Express server receives</text>
    <text x="74" y="53" fill="#1e293b" font-size="12.5" font-weight="600">and processes request</text>
  </g>

  <!-- RIGHT CARD: MongoDB (Database Layer) -->
  <g transform="translate(585, 210)">
    <rect width="220" height="80" rx="12" fill="#ffffff" stroke="#334155" stroke-width="1.8" filter="url(#card-shadow)" />
    <!-- MongoDB Leaf Icon -->
    <g transform="translate(18, 16)">
      <rect width="40" height="48" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" />
      <path d="M 20 8 C 14 16 11 25 20 40 C 29 25 26 16 20 8 Z" fill="#16a34a" />
      <path d="M 20 22 L 20 38" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />
    </g>
    <text x="74" y="36" fill="#1e293b" font-size="12.5" font-weight="600">MongoDB stores /</text>
    <text x="74" y="53" fill="#1e293b" font-size="12.5" font-weight="600">retrieves data</text>
  </g>

  <!-- BOTTOM CARD: Express Server (Response Dispatch) - FULLY VISIBLE & SPACIOUS -->
  <g transform="translate(360, 370)">
    <rect width="220" height="80" rx="12" fill="#ffffff" stroke="#334155" stroke-width="1.8" filter="url(#card-shadow)" />
    <!-- Node.js / Express Hexagon Icon -->
    <g transform="translate(16, 18)">
      <polygon points="22,4 40,14 40,36 22,46 4,36 4,14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" />
      <text x="22" y="29" font-size="13" font-weight="bold" fill="#15803d" text-anchor="middle">JS</text>
    </g>
    <text x="74" y="36" fill="#1e293b" font-size="12.5" font-weight="600">Express server receives</text>
    <text x="74" y="53" fill="#1e293b" font-size="12.5" font-weight="600">and sends response</text>
  </g>

  <!-- LEFT CARD: React Client Form / Interaction -->
  <g transform="translate(125, 210)">
    <!-- UI Notification Pill Badge -->
    <g transform="translate(-15, -18)">
      <rect width="135" height="26" rx="6" fill="#0284c7" filter="url(#pill-shadow)" />
      <!-- Small Check Icon -->
      <circle cx="16" cy="13" r="6" fill="#38bdf8" />
      <path d="M 13 13 L 15 15 L 19 11" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
      <text x="27" y="17" fill="#ffffff" font-size="11" font-weight="700" letter-spacing="0.3">UI is updated!</text>
    </g>

    <rect width="220" height="80" rx="12" fill="#ffffff" stroke="#334155" stroke-width="1.8" filter="url(#card-shadow)" />
    <!-- React / Form Edit Icon -->
    <g transform="translate(16, 18)">
      <rect width="42" height="44" rx="8" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5" />
      <path d="M 14 28 L 28 28" stroke="#0284c7" stroke-width="2" stroke-linecap="round" />
      <path d="M 14 22 L 22 22" stroke="#0284c7" stroke-width="2" stroke-linecap="round" />
      <path d="M 23 12 L 28 17 L 18 27 L 13 27 L 13 22 Z" fill="#0284c7" opacity="0.9" />
    </g>
    <text x="74" y="36" fill="#1e293b" font-size="12.5" font-weight="600">User interacts / fills</text>
    <text x="74" y="53" fill="#1e293b" font-size="12.5" font-weight="600">form in React</text>
  </g>

  <!-- Petaverse Watermark/Brand Badge in bottom right corner -->
  <g transform="translate(840, 485)">
    <circle cx="20" cy="20" r="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
    <ellipse cx="15" cy="14" rx="2.5" ry="3.5" fill="#f97316" />
    <ellipse cx="25" cy="14" rx="2.5" ry="3.5" fill="#f97316" />
    <ellipse cx="11" cy="20" rx="2.2" ry="3" fill="#f97316" />
    <ellipse cx="29" cy="20" rx="2.2" ry="3" fill="#f97316" />
    <path d="M 14 23 C 14 20 26 20 26 23 C 26 27 20 29 20 29 C 20 29 14 27 14 23 Z" fill="#f97316" />
  </g>
</svg>