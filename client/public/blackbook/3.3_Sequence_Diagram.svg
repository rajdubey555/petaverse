<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 920" width="100%" height="100%" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Arrow marker solid -->
    <marker id="arrow-solid" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#334155" />
    </marker>
    <!-- Arrow marker dashed / return -->
    <marker id="arrow-dashed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8" fill="none" stroke="#334155" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    </marker>

    <!-- Drop Shadow for headers -->
    <filter id="box-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- PURE WHITE BACKGROUND -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Diagram Title -->
  <text x="490" y="45" text-anchor="middle" fill="#0f172a" font-size="20" font-weight="800" letter-spacing="0.5">
    PETAVERSE - Sequence Diagram: User &amp; Pet Workflows
  </text>

  <!-- ==================== PARTICIPANT HEADERS ==================== -->

  <!-- 1. Pet Owner (Actor) -->
  <g transform="translate(80, 80)">
    <!-- Actor Box -->
    <rect width="110" height="75" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.8" filter="url(#box-shadow)" />
    <!-- Stick Figure Icon -->
    <circle cx="55" cy="24" r="9" fill="#ffffff" stroke="#0284c7" stroke-width="2" />
    <line x1="55" y1="33" x2="55" y2="48" stroke="#0284c7" stroke-width="2" />
    <line x1="42" y1="39" x2="68" y2="39" stroke="#0284c7" stroke-width="2" />
    <line x1="55" y1="48" x2="43" y2="60" stroke="#0284c7" stroke-width="2" />
    <line x1="55" y1="48" x2="67" y2="60" stroke="#0284c7" stroke-width="2" />
    <text x="55" y="70" text-anchor="middle" fill="#0369a1" font-size="11.5" font-weight="700">Pet Owner</text>
  </g>

  <!-- 2. Web UI (Frontend) -->
  <g transform="translate(290, 80)">
    <rect width="120" height="75" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.8" filter="url(#box-shadow)" />
    <!-- Monitor / Browser Icon -->
    <rect x="42" y="16" width="36" height="24" rx="4" fill="#ffffff" stroke="#0284c7" stroke-width="1.8" />
    <line x1="42" y1="23" x2="78" y2="23" stroke="#0284c7" stroke-width="1.2" />
    <circle cx="47" cy="19.5" r="1.5" fill="#0284c7" />
    <circle cx="52" cy="19.5" r="1.5" fill="#0284c7" />
    <circle cx="57" cy="19.5" r="1.5" fill="#0284c7" />
    <text x="60" y="56" text-anchor="middle" fill="#0369a1" font-size="12" font-weight="700">Web UI</text>
    <text x="60" y="70" text-anchor="middle" fill="#0369a1" font-size="11" font-weight="600">(React / Vite)</text>
  </g>

  <!-- 3. API Server (Backend) -->
  <g transform="translate(510, 80)">
    <rect width="125" height="75" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.8" filter="url(#box-shadow)" />
    <!-- Gears / Server Icon -->
    <rect x="46" y="16" width="34" height="22" rx="4" fill="#ffffff" stroke="#0284c7" stroke-width="1.8" />
    <line x1="51" y1="22" x2="75" y2="22" stroke="#0284c7" stroke-width="1.8" />
    <line x1="51" y1="27" x2="68" y2="27" stroke="#0284c7" stroke-width="1.8" />
    <circle cx="74" cy="31" r="2.5" fill="#16a34a" />
    <text x="62.5" y="56" text-anchor="middle" fill="#0369a1" font-size="12" font-weight="700">API Server</text>
    <text x="62.5" y="70" text-anchor="middle" fill="#0369a1" font-size="11" font-weight="600">(Express / Node)</text>
  </g>

  <!-- 4. Database Services Container -->
  <g transform="translate(710, 80)">
    <rect width="210" height="75" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.8" filter="url(#box-shadow)" />
    <text x="105" y="24" text-anchor="middle" fill="#0369a1" font-size="12" font-weight="800">Database Services</text>
    <!-- DB Cylinders -->
    <g transform="translate(18, 32)">
      <!-- Cylinder 1: Auth DB -->
      <ellipse cx="22" cy="6" rx="15" ry="5" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" />
      <path d="M 7 6 L 7 24 A 15 5 0 0 0 37 24 L 37 6" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" />
      <text x="22" y="38" text-anchor="middle" fill="#0369a1" font-size="8.5" font-weight="700">Auth DB</text>
    </g>
    <g transform="translate(76, 32)">
      <!-- Cylinder 2: Pet DB -->
      <ellipse cx="22" cy="6" rx="15" ry="5" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" />
      <path d="M 7 6 L 7 24 A 15 5 0 0 0 37 24 L 37 6" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" />
      <text x="22" y="38" text-anchor="middle" fill="#0369a1" font-size="8.5" font-weight="700">Pet DB</text>
    </g>
    <g transform="translate(134, 32)">
      <!-- Cylinder 3: Media / SOS DB -->
      <ellipse cx="22" cy="6" rx="15" ry="5" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" />
      <path d="M 7 6 L 7 24 A 15 5 0 0 0 37 24 L 37 6" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" />
      <text x="22" y="38" text-anchor="middle" fill="#0369a1" font-size="8.5" font-weight="700">Media/SOS</text>
    </g>
  </g>

  <!-- ==================== VERTICAL LIFELINES (Dashed) ==================== -->
  <line x1="135" y1="155" x2="135" y2="880" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4" />
  <line x1="350" y1="155" x2="350" y2="880" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4" />
  <line x1="572" y1="155" x2="572" y2="880" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4" />
  <line x1="750" y1="155" x2="750" y2="880" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4" />
  <line x1="808" y1="155" x2="808" y2="880" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4" />
  <line x1="866" y1="155" x2="866" y2="880" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4" />

  <!-- ==================== ACTIVATION BOXES (Rounded Rectangles) ==================== -->
  
  <!-- Actor Main Lifeline -->
  <rect x="127" y="180" width="16" height="670" rx="8" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5" />

  <!-- WORKFLOW 1: AUTHENTICATION -->
  <rect x="342" y="195" width="16" height="150" rx="4" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5" />
  <rect x="564" y="215" width="16" height="105" rx="4" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5" />
  <rect x="742" y="235" width="16" height="50" rx="4" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5" />

  <!-- WORKFLOW 2: REGISTER PET & QR TAG -->
  <rect x="342" y="420" width="16" height="175" rx="4" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5" />
  <rect x="564" y="440" width="16" height="130" rx="4" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5" />
  <rect x="800" y="460" width="16" height="55" rx="4" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5" />

  <!-- WORKFLOW 3: LOST PET SOS ALERT -->
  <rect x="342" y="660" width="16" height="165" rx="4" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5" />
  <rect x="564" y="680" width="16" height="120" rx="4" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5" />
  <rect x="858" y="700" width="16" height="55" rx="4" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5" />

  <!-- ==================== MESSAGES: WORKFLOW 1 (AUTH) ==================== -->
  
  <!-- User -> UI: Login -->
  <line x1="143" y1="200" x2="342" y2="200" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow-solid)" />
  <text x="242" y="193" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="600">Login(email, password)</text>

  <!-- UI -> API: Authenticate -->
  <line x1="358" y1="220" x2="564" y2="220" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow-solid)" />
  <text x="461" y="213" text-anchor="middle" fill="#0f172a" font-size="11.5" font-weight="600">POST /api/auth/login</text>

  <!-- API -> Auth DB: Validate -->
  <line x1="580" y1="240" x2="742" y2="240" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow-solid)" />
  <text x="661" y="233" text-anchor="middle" fill="#0f172a" font-size="11" font-weight="600">FindUser(email, hash)</text>

  <!-- Auth DB -> API: Success Record -->
  <line x1="742" y1="275" x2="580" y2="275" stroke="#334155" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow-dashed)" />
  <text x="661" y="268" text-anchor="middle" fill="#475569" font-size="11" font-weight="600">UserRecord / Success</text>

  <!-- API -> UI: JWT Token -->
  <line x1="564" y1="310" x2="358" y2="310" stroke="#334155" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow-dashed)" />
  <text x="461" y="303" text-anchor="middle" fill="#475569" font-size="11.5" font-weight="600">Auth Success / JWT Token</text>

  <!-- UI -> User: Display Dashboard -->
  <line x1="342" y1="335" x2="143" y2="335" stroke="#334155" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow-dashed)" />
  <text x="242" y="328" text-anchor="middle" fill="#475569" font-size="12" font-weight="600">Display Dashboard</text>

  <!-- Divider Line 1 -->
  <line x1="90" y1="380" x2="910" y2="380" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="8 6" />
  <rect x="420" y="370" width="140" height="20" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
  <text x="490" y="384" text-anchor="middle" fill="#64748b" font-size="10.5" font-weight="700">PET REGISTRATION FLOW</text>

  <!-- ==================== MESSAGES: WORKFLOW 2 (REGISTER & QR) ==================== -->

  <!-- User -> UI: Register Pet -->
  <line x1="143" y1="425" x2="342" y2="425" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow-solid)" />
  <text x="242" y="418" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="600">RegisterPet(details, image)</text>

  <!-- UI -> API: POST Pet -->
  <line x1="358" y1="445" x2="564" y2="445" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow-solid)" />
  <text x="461" y="438" text-anchor="middle" fill="#0f172a" font-size="11.5" font-weight="600">POST /api/pets (FormData, JWT)</text>

  <!-- API -> Pet DB: Save Record -->
  <line x1="580" y1="465" x2="800" y2="465" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow-solid)" />
  <text x="690" y="458" text-anchor="middle" fill="#0f172a" font-size="11" font-weight="600">CreatePet(details, qrCode)</text>

  <!-- Pet DB -> API: Saved Record -->
  <line x1="800" y1="505" x2="580" y2="505" stroke="#334155" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow-dashed)" />
  <text x="690" y="498" text-anchor="middle" fill="#475569" font-size="11" font-weight="600">Pet Record Created</text>

  <!-- API -> UI: 201 Created & QR Hash -->
  <line x1="564" y1="545" x2="358" y2="545" stroke="#334155" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow-dashed)" />
  <text x="461" y="538" text-anchor="middle" fill="#475569" font-size="11.5" font-weight="600">201 Created / Pet Data + QR Tag</text>

  <!-- UI -> User: Show QR Collar Tag Modal -->
  <line x1="342" y1="580" x2="143" y2="580" stroke="#334155" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow-dashed)" />
  <text x="242" y="573" text-anchor="middle" fill="#475569" font-size="12" font-weight="600">Display QR Collar Modal</text>

  <!-- Divider Line 2 -->
  <line x1="90" y1="620" x2="910" y2="620" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="8 6" />
  <rect x="420" y="610" width="140" height="20" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
  <text x="490" y="624" text-anchor="middle" fill="#64748b" font-size="10.5" font-weight="700">LOST PET SOS ALERT FLOW</text>

  <!-- ==================== MESSAGES: WORKFLOW 3 (LOST SOS) ==================== -->

  <!-- User -> UI: Trigger Lost SOS -->
  <line x1="143" y1="665" x2="342" y2="665" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow-solid)" />
  <text x="242" y="658" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="600">ToggleLostSOS(petId, status)</text>

  <!-- UI -> API: PATCH SOS -->
  <line x1="358" y1="685" x2="564" y2="685" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow-solid)" />
  <text x="461" y="678" text-anchor="middle" fill="#0f172a" font-size="11.5" font-weight="600">PATCH /api/pets/:id/sos (status)</text>

  <!-- API -> Media/SOS DB: Update Beacon -->
  <line x1="580" y1="705" x2="858" y2="705" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow-solid)" />
  <text x="719" y="698" text-anchor="middle" fill="#0f172a" font-size="11" font-weight="600">SetStatus(isLost: true, beacon)</text>

  <!-- Media/SOS DB -> API: Confirmed -->
  <line x1="858" y1="745" x2="580" y2="745" stroke="#334155" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow-dashed)" />
  <text x="719" y="738" text-anchor="middle" fill="#475569" font-size="11" font-weight="600">Status Updated &amp; Broadcast</text>

  <!-- API -> UI: 200 OK Status -->
  <line x1="564" y1="785" x2="358" y2="785" stroke="#334155" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow-dashed)" />
  <text x="461" y="778" text-anchor="middle" fill="#475569" font-size="11.5" font-weight="600">200 OK / SOS Broadcast Active</text>

  <!-- UI -> User: Show SOS Banner -->
  <line x1="342" y1="815" x2="143" y2="815" stroke="#334155" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow-dashed)" />
  <text x="242" y="808" text-anchor="middle" fill="#475569" font-size="12" font-weight="600">Display SOS Beacon Alert</text>

</svg>
