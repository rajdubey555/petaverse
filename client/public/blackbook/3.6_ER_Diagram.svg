  <g transform="translate(560, 890)"><ellipse cx="0" cy="0" rx="52" ry="19" fill="#ffffff" stroke="#1e293b" stroke-width="1.6" /><text x="0" y="4" text-anchor="middle" fill="#0f172a" font-size="11.5" font-weight="600">med_title</text></g>
  <g transform="translate(680, 865)"><ellipse cx="0" cy="0" rx="52" ry="19" fill="#ffffff" stroke="#1e293b" stroke-width="1.6" /><text x="0" y="4" text-anchor="middle" fill="#0f172a" font-size="11.5" font-weight="600">med_desc</text></g>

  <!-- CollarQRTag Attributes -->
  <g transform="translate(1290, 590)"><ellipse cx="0" cy="0" rx="52" ry="19" fill="#ffffff" stroke="#1e293b" stroke-width="1.6" /><text x="0" y="4" text-anchor="middle" fill="#0f172a" font-size="11.5" font-weight="600">pet_tag_id</text></g>
  <g transform="translate(1340, 640)"><ellipse cx="0" cy="0" rx="48" ry="19" fill="#ffffff" stroke="#1e293b" stroke-width="1.8" /><text x="0" y="4" text-anchor="middle" fill="#0f172a" font-size="11.5" font-weight="700" text-decoration="underline">#tag_id</text></g>
