  <g transform="translate(230, 180)"><ellipse cx="0" cy="0" rx="52" ry="19" fill="#ffffff" stroke="#1e293b" stroke-width="1.6" /><text x="0" y="4" text-anchor="middle" fill="#0f172a" font-size="11.5" font-weight="600">user_name</text></g>
  <g transform="translate(110, 220)"><ellipse cx="0" cy="0" rx="50" ry="19" fill="#ffffff" stroke="#1e293b" stroke-width="1.8" /><text x="0" y="4" text-anchor="middle" fill="#0f172a" font-size="11.5" font-weight="700" text-decoration="underline">#user_id</text></g>
  <g transform="translate(100, 280)"><ellipse cx="0" cy="0" rx="54" ry="19" fill="#ffffff" stroke="#1e293b" stroke-width="1.6" /><text x="0" y="4" text-anchor="middle" fill="#0f172a" font-size="11.5" font-weight="600">user_mobile</text></g>
  <g transform="translate(110, 340)"><ellipse cx="0" cy="0" rx="52" ry="19" fill="#ffffff" stroke="#1e293b" stroke-width="1.6" /><text x="0" y="4" text-anchor="middle" fill="#0f172a" font-size="11.5" font-weight="600">user_email</text></g>
  <g transform="translate(230, 380)"><ellipse cx="0" cy="0" rx="56" ry="19" fill="#ffffff" stroke="#1e293b" stroke-width="1.6" /><text x="0" y="4" text-anchor="middle" fill="#0f172a" font-size="11.5" font-weight="600">user_address</text></g>

  <!-- Login Attributes -->
  <g transform="translate(550, 90)"><ellipse cx="0" cy="0" rx="48" ry="19" fill="#ffffff" stroke="#1e293b" stroke-width="1.8" /><text x="0" y="4" text-anchor="middle" fill="#0f172a" font-size="11.5" font-weight="700" text-decoration="underline">#login_id</text></g>
  <g transform="translate(660, 45)"><ellipse cx="0" cy="0" rx="58" ry="19" fill="#ffffff" stroke="#1e293b" stroke-width="1.6" /><text x="0" y="4" text-anchor="middle" fill="#0f172a" font-size="11" font-weight="600">login_role_id</text></g>
  <g transform="translate(800, 45)"><ellipse cx="0" cy="0" rx="62" ry="19" fill="#ffffff" stroke="#1e293b" stroke-width="1.6" /><text x="0" y="4" text-anchor="middle" fill="#0f172a" font-size="11" font-weight="600">login_username</text></g>
  <g transform="translate(915, 90)"><ellipse cx="0" cy="0" rx="58" ry="19" fill="#ffffff" stroke="#1e293b" stroke-width="1.6" /><text x="0" y="4" text-anchor="middle" fill="#0f172a" font-size="11" font-weight="600">user_password</text></g>

