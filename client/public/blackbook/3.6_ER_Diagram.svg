  <line x1="730" y1="405" x2="840" y2="405" stroke="#475569" stroke-width="1.4" />
  <line x1="730" y1="415" x2="825" y2="455" stroke="#475569" stroke-width="1.4" />
  <line x1="675" y1="426" x2="685" y2="465" stroke="#475569" stroke-width="1.4" />

