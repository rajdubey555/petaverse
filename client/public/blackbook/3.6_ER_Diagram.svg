  <g transform="translate(920, 670)"><ellipse cx="0" cy="0" rx="56" ry="19" fill="#ffffff" stroke="#1e293b" stroke-width="1.6" /><text x="0" y="4" text-anchor="middle" fill="#0f172a" font-size="11" font-weight="600">request_date</text></g>
  <g transform="translate(900, 725)"><ellipse cx="0" cy="0" rx="56" ry="19" fill="#ffffff" stroke="#1e293b" stroke-width="1.6" /><text x="0" y="4" text-anchor="middle" fill="#0f172a" font-size="11" font-weight="600">inquiry_type</text></g>
  <g transform="translate(790, 745)"><ellipse cx="0" cy="0" rx="52" ry="19" fill="#ffffff" stroke="#1e293b" stroke-width="1.6" /><text x="0" y="4" text-anchor="middle" fill="#0f172a" font-size="11.5" font-weight="600">adopter_id</text></g>
  <g transform="translate(675, 745)"><ellipse cx="0" cy="0" rx="54" ry="19" fill="#ffffff" stroke="#1e293b" stroke-width="1.8" /><text x="0" y="4" text-anchor="middle" fill="#0f172a" font-size="11.5" font-weight="700" text-decoration="underline">#inquiry_id</text></g>

