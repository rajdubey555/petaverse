<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1460 1060" width="100%" height="100%" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- PURE WHITE BACKGROUND -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Diagram Title -->
  <text x="730" y="38" text-anchor="middle" fill="#0f172a" font-size="22" font-weight="800" letter-spacing="0.5">
    3.6 E-R Diagram
  </text>

  <!-- ==================== UPPER CLUSTER CONNECTING LINES ==================== -->
  
  <!-- Has -> User -->
  <line x1="670" y1="270" x2="470" y2="270" stroke="#1e293b" stroke-width="2" />
  
  <!-- Has -> Login -->
  <line x1="730" y1="235" x2="730" y2="184" stroke="#1e293b" stroke-width="2" />

  <!-- Has -> Roles -->
  <line x1="790" y1="270" x2="860" y2="270" stroke="#1e293b" stroke-width="2" />

  <!-- Has -> Permission (Down then Right) -->
  <path d="M 730 305 L 730 380 L 860 380" fill="none" stroke="#1e293b" stroke-width="2" />

  <!-- User Attributes lines (fanning out to the left) -->
  <line x1="340" y1="255" x2="275" y2="195" stroke="#475569" stroke-width="1.4" />
  <line x1="340" y1="265" x2="160" y2="225" stroke="#475569" stroke-width="1.4" />
  <line x1="340" y1="270" x2="155" y2="280" stroke="#475569" stroke-width="1.4" />
  <line x1="340" y1="278" x2="160" y2="335" stroke="#475569" stroke-width="1.4" />
  <line x1="340" y1="288" x2="275" y2="368" stroke="#475569" stroke-width="1.4" />

  <!-- Login Attributes lines (fanning above Login) -->
  <line x1="680" y1="140" x2="595" y2="102" stroke="#475569" stroke-width="1.4" />
  <line x1="710" y1="140" x2="685" y2="62" stroke="#475569" stroke-width="1.4" />
  <line x1="750" y1="140" x2="775" y2="62" stroke="#475569" stroke-width="1.4" />
  <line x1="780" y1="140" x2="865" y2="102" stroke="#475569" stroke-width="1.4" />

  <!-- Roles Attributes lines (fanning to the right) -->
  <line x1="990" y1="258" x2="1040" y2="220" stroke="#475569" stroke-width="1.4" />
  <line x1="990" y1="270" x2="1070" y2="270" stroke="#475569" stroke-width="1.4" />
  <line x1="990" y1="282" x2="1040" y2="320" stroke="#475569" stroke-width="1.4" />

  <!-- Permission Attributes lines (fanning to the right & bottom) -->
  <line x1="990" y1="370" x2="1040" y2="390" stroke="#475569" stroke-width="1.4" />
  <line x1="990" y1="382" x2="1070" y2="440" stroke="#475569" stroke-width="1.4" />
  <line x1="950" y1="402" x2="1020" y2="495" stroke="#475569" stroke-width="1.4" />
  <line x1="910" y1="402" x2="910" y2="465" stroke="#475569" stroke-width="1.4" />

  <!-- Trunk Line: User -> Manage (Down from User, Right to Center, Down into Manage) -->
  <path d="M 405 292 L 405 480 L 730 480 L 730 520" fill="none" stroke="#1e293b" stroke-width="2.2" />

  <!-- ==================== LOWER CLUSTER CONNECTING LINES ==================== -->

  <!-- Manage -> Pet (Left then Down) -->
  <path d="M 655 560 L 320 560 L 320 640" fill="none" stroke="#1e293b" stroke-width="2" />

  <!-- Manage -> Adoption (Straight Down) -->
  <line x1="730" y1="600" x2="730" y2="640" stroke="#1e293b" stroke-width="2" />

  <!-- Manage -> CollarQRTag (Right then Down) -->
  <path d="M 805 560 L 1140 560 L 1140 640" fill="none" stroke="#1e293b" stroke-width="2" />

  <!-- Pet Attributes lines (fanning cleanly around Pet) -->
  <line x1="340" y1="640" x2="370" y2="605" stroke="#475569" stroke-width="1.4" />
  <line x1="290" y1="640" x2="250" y2="605" stroke="#475569" stroke-width="1.4" />
  <line x1="250" y1="655" x2="175" y2="635" stroke="#475569" stroke-width="1.4" />
  <line x1="250" y1="667" x2="160" y2="685" stroke="#475569" stroke-width="1.4" />
  <line x1="250" y1="679" x2="170" y2="735" stroke="#475569" stroke-width="1.4" />
  <line x1="290" y1="684" x2="250" y2="765" stroke="#475569" stroke-width="1.4" />

  <!-- Adoption Attributes lines (fanning cleanly with ample room) -->
  <line x1="800" y1="650" x2="850" y2="620" stroke="#475569" stroke-width="1.4" />
  <line x1="800" y1="662" x2="870" y2="670" stroke="#475569" stroke-width="1.4" />
  <line x1="800" y1="674" x2="855" y2="720" stroke="#475569" stroke-width="1.4" />
  <line x1="760" y1="684" x2="775" y2="730" stroke="#475569" stroke-width="1.4" />
  <line x1="700" y1="684" x2="685" y2="730" stroke="#475569" stroke-width="1.4" />

  <!-- Adoption -> Has (small diamond) -> MedicalRecord -->
  <path d="M 660 662 L 560 662 L 560 690" fill="none" stroke="#1e293b" stroke-width="2" />
  <line x1="560" y1="740" x2="560" y2="775" stroke="#1e293b" stroke-width="2" />

  <!-- MedicalRecord Attributes lines -->
  <line x1="510" y1="819" x2="455" y2="855" stroke="#475569" stroke-width="1.4" />
  <line x1="560" y1="819" x2="560" y2="872" stroke="#475569" stroke-width="1.4" />
  <line x1="610" y1="819" x2="665" y2="855" stroke="#475569" stroke-width="1.4" />

  <!-- CollarQRTag Attributes lines (fanning to the right & bottom) -->
  <line x1="1210" y1="650" x2="1255" y2="600" stroke="#475569" stroke-width="1.4" />
  <line x1="1210" y1="662" x2="1300" y2="640" stroke="#475569" stroke-width="1.4" />
  <line x1="1210" y1="674" x2="1305" y2="700" stroke="#475569" stroke-width="1.4" />
  <line x1="1190" y1="684" x2="1245" y2="745" stroke="#475569" stroke-width="1.4" />
  <line x1="1140" y1="684" x2="1160" y2="765" stroke="#475569" stroke-width="1.4" />

  <!-- ==================== DIAMONDS (RELATIONSHIP SETS) ==================== -->

  <!-- Relationship: Has (Upper Center) -->
  <g transform="translate(730, 270)">
    <polygon points="0,-35 60,0 0,35 -60,0" fill="#ffffff" stroke="#1e293b" stroke-width="2.2" />
    <text x="0" y="5" text-anchor="middle" fill="#0f172a" font-size="13" font-weight="700">Has</text>
  </g>

  <!-- Relationship: Manage (Lower Center) -->
  <g transform="translate(730, 560)">
    <polygon points="0,-40 75,0 0,40 -75,0" fill="#ffffff" stroke="#1e293b" stroke-width="2.2" />
    <text x="0" y="5" text-anchor="middle" fill="#0f172a" font-size="13.5" font-weight="700">Manage</text>
  </g>

  <!-- Relationship: Has (Adoption -> MedicalRecord) -->
