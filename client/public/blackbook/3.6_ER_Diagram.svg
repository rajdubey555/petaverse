    <rect width="140" height="44" rx="4" fill="#334155" stroke="#1e293b" stroke-width="1.8" />
    <text x="70" y="27" text-anchor="middle" fill="#ffffff" font-size="13.5" font-weight="700">CollarQRTag</text>
  </g>

