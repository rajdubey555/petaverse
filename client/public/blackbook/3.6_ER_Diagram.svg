  <g transform="translate(665, 183)"><ellipse cx="0" cy="0" rx="56" ry="17" fill="#ffffff" stroke="#1e293b" stroke-width="1.5" /><text x="0" y="4" text-anchor="middle" fill="#0f172a" font-size="10.5">user_password</text></g>

