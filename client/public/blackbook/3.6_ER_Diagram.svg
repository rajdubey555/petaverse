    <text x="65" y="27" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">Roles</text>
  </g>

  <!-- Entity: Permission -->
  <g transform="translate(860, 358)" filter="url(#shadow)">
    <rect width="130" height="44" rx="4" fill="#334155" stroke="#1e293b" stroke-width="1.8" />
    <text x="65" y="27" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">Permission</text>
  </g>

  <!-- Entity: Pet -->
  <g transform="translate(250, 640)" filter="url(#shadow)">
    <rect width="140" height="44" rx="4" fill="#334155" stroke="#1e293b" stroke-width="1.8" />
    <text x="70" y="27" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">Pet</text>
  </g>

  <!-- Entity: Adoption -->
  <g transform="translate(660, 640)" filter="url(#shadow)">
    <rect width="140" height="44" rx="4" fill="#334155" stroke="#1e293b" stroke-width="1.8" />
    <text x="70" y="27" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">Adoption</text>
  </g>

