  <g transform="translate(1080, 390)"><ellipse cx="0" cy="0" rx="48" ry="19" fill="#ffffff" stroke="#1e293b" stroke-width="1.8" /><text x="0" y="4" text-anchor="middle" fill="#0f172a" font-size="11.5" font-weight="700" text-decoration="underline">#per_id</text></g>
  <g transform="translate(1120, 445)"><ellipse cx="0" cy="0" rx="56" ry="19" fill="#ffffff" stroke="#1e293b" stroke-width="1.6" /><text x="0" y="4" text-anchor="middle" fill="#0f172a" font-size="11" font-weight="600">per_role_id</text></g>
  <g transform="translate(1060, 500)"><ellipse cx="0" cy="0" rx="56" ry="19" fill="#ffffff" stroke="#1e293b" stroke-width="1.6" /><text x="0" y="4" text-anchor="middle" fill="#0f172a" font-size="11" font-weight="600">per_module</text></g>
  <g transform="translate(910, 485)"><ellipse cx="0" cy="0" rx="50" ry="19" fill="#ffffff" stroke="#1e293b" stroke-width="1.6" /><text x="0" y="4" text-anchor="middle" fill="#0f172a" font-size="11" font-weight="600">per_name</text></g>

  <!-- Pet Attributes -->
  <g transform="translate(390, 595)"><ellipse cx="0" cy="0" rx="52" ry="19" fill="#ffffff" stroke="#1e293b" stroke-width="1.6" /><text x="0" y="4" text-anchor="middle" fill="#0f172a" font-size="11.5" font-weight="600">pet_breed</text></g>
  <g transform="translate(230, 595)"><ellipse cx="0" cy="0" rx="48" ry="19" fill="#ffffff" stroke="#1e293b" stroke-width="1.8" /><text x="0" y="4" text-anchor="middle" fill="#0f172a" font-size="11.5" font-weight="700" text-decoration="underline">#pet_id</text></g>
  <g transform="translate(130, 630)"><ellipse cx="0" cy="0" rx="50" ry="19" fill="#ffffff" stroke="#1e293b" stroke-width="1.6" /><text x="0" y="4" text-anchor="middle" fill="#0f172a" font-size="11.5" font-weight="600">pet_name</text></g>
  <g transform="translate(110, 685)"><ellipse cx="0" cy="0" rx="54" ry="19" fill="#ffffff" stroke="#1e293b" stroke-width="1.6" /><text x="0" y="4" text-anchor="middle" fill="#0f172a" font-size="11.5" font-weight="600">pet_species</text></g>
  <g transform="translate(130, 740)"><ellipse cx="0" cy="0" rx="46" ry="19" fill="#ffffff" stroke="#1e293b" stroke-width="1.6" /><text x="0" y="4" text-anchor="middle" fill="#0f172a" font-size="11.5" font-weight="600">pet_age</text></g>
  <g transform="translate(230, 780)"><ellipse cx="0" cy="0" rx="52" ry="19" fill="#ffffff" stroke="#1e293b" stroke-width="1.6" /><text x="0" y="4" text-anchor="middle" fill="#0f172a" font-size="11.5" font-weight="600">pet_gender</text></g>

  <!-- Adoption Attributes -->
