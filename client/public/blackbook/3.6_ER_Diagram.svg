  <g transform="translate(1120, 270)"><ellipse cx="0" cy="0" rx="54" ry="19" fill="#ffffff" stroke="#1e293b" stroke-width="1.6" /><text x="0" y="4" text-anchor="middle" fill="#0f172a" font-size="11.5" font-weight="600">role_name</text></g>
  <g transform="translate(1080, 330)"><ellipse cx="0" cy="0" rx="52" ry="19" fill="#ffffff" stroke="#1e293b" stroke-width="1.6" /><text x="0" y="4" text-anchor="middle" fill="#0f172a" font-size="11.5" font-weight="600">role_desc</text></g>

