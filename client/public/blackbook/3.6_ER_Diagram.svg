  <!-- Diagram Title -->
  <text x="570" y="38" text-anchor="middle" fill="#0f172a" font-size="21" font-weight="800" letter-spacing="0.5">
    3.6 E-R Diagram
  </text>

  <!-- ==================== UPPER CLUSTER CONNECTING LINES ==================== -->
  
  <!-- Has -> User -->
  <line x1="455" y1="285" x2="350" y2="285" stroke="#1e293b" stroke-width="2" />
  
  <!-- Has -> Login -->
  <line x1="500" y1="250" x2="500" y2="204" stroke="#1e293b" stroke-width="2" />

  <!-- Has -> Roles -->
  <line x1="545" y1="285" x2="610" y2="285" stroke="#1e293b" stroke-width="2" />

  <!-- Has -> Permission -->
  <path d="M 500 320 L 500 405 L 620 405" fill="none" stroke="#1e293b" stroke-width="2" />

  <!-- User Attributes lines (fanning on the left) -->
  <line x1="290" y1="264" x2="310" y2="218" stroke="#475569" stroke-width="1.4" />
  <line x1="245" y1="264" x2="185" y2="218" stroke="#475569" stroke-width="1.4" />
  <line x1="240" y1="285" x2="145" y2="285" stroke="#475569" stroke-width="1.4" />
  <line x1="245" y1="300" x2="155" y2="340" stroke="#475569" stroke-width="1.4" />
  <line x1="270" y1="306" x2="185" y2="395" stroke="#475569" stroke-width="1.4" />

  <!-- Login Attributes lines (fanning above Login) -->
  <line x1="465" y1="162" x2="375" y2="135" stroke="#475569" stroke-width="1.4" />
  <line x1="500" y1="162" x2="475" y2="85" stroke="#475569" stroke-width="1.4" />
  <line x1="535" y1="162" x2="585" y2="135" stroke="#475569" stroke-width="1.4" />
  <line x1="555" y1="183" x2="665" y2="183" stroke="#475569" stroke-width="1.4" />

  <!-- Roles Attributes lines (fanning right of Roles) -->
  <line x1="720" y1="272" x2="795" y2="240" stroke="#475569" stroke-width="1.4" />
  <line x1="720" y1="285" x2="815" y2="285" stroke="#475569" stroke-width="1.4" />
  <line x1="720" y1="298" x2="795" y2="335" stroke="#475569" stroke-width="1.4" />

